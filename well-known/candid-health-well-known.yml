notes:
  - >-
    The api-catalog is served by the Fern-hosted documentation platform, not by
    the API host. It is nonetheless a genuine machine-readable pointer to Candid's
    own OpenAPI and is the only /.well-known/ document the company serves.
  - >-
    No security.txt on any host, so no SecurityTxt pointer is emitted and no
    vulnerability-disclosure contact could be discovered this way.
  - >-
    The OAuth token endpoint is a plain POST to /api/auth/v2/token; Candid does not
    publish OAuth 2.0 Authorization Server Metadata (RFC 8414) or OpenID discovery,
    even though the tokens are Auth0-issued JWTs.
