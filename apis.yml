aid: candid-health
name: Candid Health
description: Candid Health is a medical billing automation platform providing REST APIs for submitting
  claims, checking real-time eligibility, managing encounters, processing remittances, handling prior
  authorizations, patient collections, credentialing, and full revenue cycle management for healthcare
  providers.
