name: Candid Health MCP-to-REST Tool Crosswalk
description: >-
  Binds every tool on Candid Health's live MCP server to the OpenAPI operations
  that back it. The result is a one-sided crosswalk: the MCP server is a
  documentation-search server, so it has zero REST bindings, and all 251 API
  operations are REST-only. This is the honest measurement of Candid's agent
  surface — an agent can read the docs through MCP but cannot do revenue-cycle
  work through it.

