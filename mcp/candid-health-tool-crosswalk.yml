notes:
  - >-
    The highest-value candidates for a future API MCP server are the flows
    Candid itself documents as the integration path: POST /api/auth/v2/token
    (get_token), POST /api/encounters/v4 (create), POST /eligibility-checks/v1
    (post) and POST /api/charge_captures/v1 (create). Those are named here as
    OBSERVATION, not as a claim that any tool exists for them.
  - >-
    Because the REST surface is entirely OAuth-gated and carries PHI, a
    Candid API MCP server would need per-tenant credentials — which is the most
    likely reason the published server stops at documentation search.
