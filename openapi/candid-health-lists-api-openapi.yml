    type_pre-encounter_coverages_v1_MutableCoverage:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/type_pre-encounter_coverages_v1_CoverageStatus'
          description: The status indiciating if the coverage is active or not.
        subscriber:
          $ref: '#/components/schemas/type_pre-encounter_coverages_v1_Subscriber'
          description: The party who has signed-up for or 'owns' the contractual relationship to the policy or to whom the benefit of the policy for services rendered to them or their family is due.
        relationship:
          $ref: '#/components/schemas/type_pre-encounter_common_Relationship'
          description: The relationship of beneficiary (patient) to the subscriber. https://hl7.org/fhir/valueset-relationship.html
        patient:
          $ref: '#/components/schemas/type_pre-encounter_common_PatientId'
          description: The canonical Candid patient UUID corresponding with the patient who benefits from the insurance coverage
        insurance_plan:
          $ref: '#/components/schemas/type_pre-encounter_coverages_v1_InsurancePlan'
        verified:
          type: boolean
          description: A boolean indicating if the coverage has been verified by a user.
        eligibility_checks:
          type: array
          items:
            $ref: '#/components/schemas/type_pre-encounter_eligibilityChecks_v1_EligibilityCheckMetadata'
          description: A list of eligibility check metadata that have been initiated on this coverage.
        latest_eligibility_check:
          $ref: '#/components/schemas/type_pre-encounter_coverages_v1_LatestEligibilityCheck'
          description: The latest eligibility check metadata that has been initiated on this coverage.
        benefits:
          $ref: '#/components/schemas/type_pre-encounter_coverages_v1_CoverageBenefits'
          description: The eligibility of the patient for the coverage, manually verified by users.
        orcon:
          type: boolean
          description: ORCON (Originator Controlled) - When set to true, the Candid system will hide this coverage from downstream integrations. Updates made in the Candid UI will unset this flag. Defaults to false.
        auto_update_enabled:
          type: boolean
          description: Default to true. When set to true, the Candid system will automatically update this coverage with the latest eligibility check benefits information. Auto update behavior is also set at the eligibilityConfig org level configuration.
        previous_appointment_copays:
          type: object
          additionalProperties:
            type: integer
          description: A map of UniversalServiceIdentifier (MD_Visit, Treatment, Tests, Activity) to copay values in cents. This is used to track copay values for each service type to handle OOP max resets correctly.
      required:
      - status
      - subscriber
      - relationship
      - patient
      - insurance_plan
      - verified
      title: MutableCoverage
    type_pre-encounter_patients_v1_Authorization:
      type: object
      properties:
        payer_id:
          $ref: '#/components/schemas/type_pre-encounter_common_PayerId'
        payer_name:
          type: string
        additional_payer_information:
          $ref: '#/components/schemas/type_pre-encounter_common_AdditionalPayerInformation'
        authorization_number:
          type: string
        cpt_code:
          type: string
        apply_for_all_cpt_codes:
          type: boolean
          description: If true, then the authorization will apply for all claims for the payer that fall in range the `period`.
        no_prior_authorization_required:
          type: boolean
          description: If true, indicates that prior authorization is not required and prior authorization number will not be set on the claim for this authorization.
        units:
          $ref: '#/components/schemas/type_pre-encounter_patients_v1_AuthorizationUnit'
        quantity:
          type: integer
        period:
          $ref: '#/components/schemas/type_pre-encounter_common_Period'
        notes:
          type: string
        billing_provider_npi:
          type: string
          description: The NPI of the billing provider for which this authorization applies.
        service_facility:
          $ref: '#/components/schemas/type_pre-encounter_common_PatientServiceFacility'
          description: When set, specifies the service facility for which this authorization applies.
        dx_codes:
          type: array
          items:
            type: string
          description: When set, the authorization will only apply when at least one of these diagnosis codes is found on the claim/service lines (in addition to other criteria).
      required:
      - payer_id
      - payer_name
      - authorization_number
      - cpt_code
      - units
      title: Authorization
