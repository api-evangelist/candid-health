openapi: 3.2.0
info:
  title: Reference Insurance Adjudications API
  version: 1.0.0
servers:
- url: https://pre-api.joincandidhealth.com
  description: Production
- url: https://pre-api-staging.joincandidhealth.com
  description: Staging
- url: https://sandbox-pre-api.joincandidhealth.com
  description: CandidSandbox
- url: https://staging-pre-api.joincandidhealth.com
  description: CandidStaging
- url: http://localhost:4000
  description: Local
- url: https://api.joincandidhealth.com
  description: Production
- url: https://api-staging.joincandidhealth.com
  description: Staging
- url: https://sandbox-api.joincandidhealth.com
  description: CandidSandbox
- url: https://staging-api.joincandidhealth.com
  description: CandidStaging
- url: http://localhost:5050
  description: Local
tags:
- name: Insurance Adjudications
paths:
  /api/insurance-adjudications/v1/{insurance_adjudication_id}:
    get:
      operationId: get
      summary: Get insurance adjudication
      description: Retrieves a previously created insurance adjudication by its `insurance_adjudication_id`.
      tags:
      - Insurance Adjudications
      parameters:
      - name: insurance_adjudication_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/type_insurance-adjudications_v1_InsuranceAdjudicationId'
      - name: Authorization
        in: header
        description: OAuth authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_insurance-adjudications_v1_InsuranceAdjudication'
        '403':
          description: Error response with status 403
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - UnauthorizedError
                  content:
                    $ref: '#/components/schemas/type_commons_UnauthorizedErrorMessage'
                required:
                - errorName
                - content
components:
  schemas:
    type_x12_v1_RemittanceAdviceRemarkCode:
      type: object
      properties:
        reason_code:
          $ref: '#/components/schemas/type_x12_v1_Rarc'
      required:
      - reason_code
      title: RemittanceAdviceRemarkCode
    type_x12_v1_ClaimAdjustmentReasonCode:
      type: object
      properties:
        group_code:
          $ref: '#/components/schemas/type_commons_ClaimAdjustmentGroupCodes'
        reason_code:
          $ref: '#/components/schemas/type_x12_v1_Carc'
        amount_cents:
          type: integer
      required:
      - group_code
      - reason_code
      - amount_cents
      title: ClaimAdjustmentReasonCode
    type_insurance-adjudications_v1_ServiceLineAdjudicationId:
      type: string
      format: uuid
      title: ServiceLineAdjudicationId
    type_commons_ClaimId:
      type: string
      format: uuid
      title: ClaimId
    type_commons_ClaimAdjustmentGroupCodes:
      type: string
      enum:
      - CO
      - CR
      - DE
      - MA
      - OA
      - PI
      - PR
      - RR
