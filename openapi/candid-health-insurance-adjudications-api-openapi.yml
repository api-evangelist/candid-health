    type_insurance-adjudications_v1_ServiceLineAdjudication:
      type: object
      properties:
        service_line_adjudication_id:
          $ref: '#/components/schemas/type_insurance-adjudications_v1_ServiceLineAdjudicationId'
        denial_reason:
          $ref: '#/components/schemas/type_service-lines_v2_DenialReasonContent'
          description: Will be treated as a denial if present
        insurance_allowed_amount_cents:
          type: integer
        insurance_paid_amount_cents:
          type: integer
        deductible_amount_cents:
          type: integer
        coinsurance_amount_cents:
          type: integer
        copay_amount_cents:
          type: integer
        carcs:
          type: array
          items:
            $ref: '#/components/schemas/type_x12_v1_ClaimAdjustmentReasonCode'
        rarcs:
          type: array
          items:
            $ref: '#/components/schemas/type_x12_v1_RemittanceAdviceRemarkCode'
      required:
      - service_line_adjudication_id
      - carcs
      - rarcs
      title: ServiceLineAdjudication
    type_insurance-adjudications_v1_ClaimAdjudication:
      type: object
      properties:
        claim_id:
          $ref: '#/components/schemas/type_commons_ClaimId'
        insurance_allowed_amount_cents:
          type: integer
        insurance_paid_amount_cents:
          type: integer
        charge_amount_cents:
          type: integer
        service_lines:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/type_insurance-adjudications_v1_ServiceLineAdjudication'
        payer_claim_number:
          type: string
        carcs:
          type: array
          items:
            $ref: '#/components/schemas/type_x12_v1_ClaimAdjustmentReasonCode'
      required:
      - claim_id
      - service_lines
      - carcs
      title: ClaimAdjudication
    type_service-lines_v2_DenialReasonContent:
      type: string
      enum:
      - Authorization Required
      - Referral Required
      - Medical Records Requested
      - Timely Filing
      - Duplicate Claim
      - Full Contractual Adjustment
      - Incorrect Place of Service
      - Incorrect Patient Gender
      - Incorrect Patient Info
      - Bundled
      - Exceeded Billable Time
      - Invalid Provider Information
      - Invalid Diagnosis Code
      - Incorrect Procedure Code
      - Invalid Modifier
      - Missing NDC Code
      - Invalid Insurance Data
      - No Active Coverage
      - Coordination of Benefits
      - Incorrect Payer
      - Credentialing
      - No Effective Contract
      - Missing W-9
      - Missing Contract Linkage
      - Non-Covered Benefit
      - Experimental Procedure
      - Not Medically Necessary
      - Info Requested from Provider
      - Info Requested from Patient
      - Billing Error
      - Unknown
      - Max Benefit Reached
      title: DenialReasonContent
    type_insurance-adjudications_v1_InsuranceAdjudication:
      type: object
      properties:
        insurance_adjudication_id:
          $ref: '#/components/schemas/type_insurance-adjudications_v1_InsuranceAdjudicationId'
        payer_uuid:
          $ref: '#/components/schemas/type_payers_v3_PayerUuid'
        post_date:
          type: string
          format: date
        check_number:
          type: string
        check_date:
          type: string
          format: date
        note:
          type: string
        claims:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/type_insurance-adjudications_v1_ClaimAdjudication'
      required:
      - insurance_adjudication_id
      - payer_uuid
      - check_date
      - claims
      title: InsuranceAdjudication
