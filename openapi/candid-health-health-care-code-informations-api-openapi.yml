openapi: 3.2.0
info:
  title: Reference Health Care Code Informations API
  version: 1.0.0
servers:
- url: https://pre-api.joincandidhealth.com
  description: Production
- url: https://pre-api-staging.joincandidhealth.com
  description: Staging
- url: https://sandbox-pre-api.joincandidhealth.com
  description: CandidSandbox
- url: https://staging-pre-api.joincandidhealth.com
  description: CandidStaging
- url: http://localhost:4000
  description: Local
- url: https://api.joincandidhealth.com
  description: Production
- url: https://api-staging.joincandidhealth.com
  description: Staging
- url: https://sandbox-api.joincandidhealth.com
  description: CandidSandbox
- url: https://staging-api.joincandidhealth.com
  description: CandidStaging
- url: http://localhost:5050
  description: Local
tags:
- name: Health Care Code Informations
paths:
  /api/health-care-code-informations/v1/{encounter_id}:
    put:
      operationId: update
      summary: Update
      tags:
      - Health Care Code Informations
      parameters:
      - name: encounter_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/type_commons_EncounterId'
      - name: Authorization
        in: header
        description: OAuth authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_health-care-code-information_v1_HealthCareCodeInformationGetAllResponse'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - EntityNotFoundError
                  content:
                    $ref: '#/components/schemas/type_commons_EntityNotFoundErrorMessage'
                required:
                - errorName
                - content
        '422':
          description: Error response with status 422
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - HttpRequestValidationError
                  content:
                    $ref: '#/components/schemas/type_commons_RequestValidationError'
                required:
                - errorName
                - content
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/type_health-care-code-information_v1_HealthCareCodeInformationUpdate'
    get:
      operationId: get_all_for_encounter
      summary: Get All For Encounter
      tags:
      - Health Care Code Informations
      parameters:
      - name: encounter_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/type_commons_EncounterId'
      - name: Authorization
        in: header
        description: OAuth authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_health-care-code-information_v1_HealthCareCodeInformationGetAllResponse'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - EntityNotFoundError
                  content:
                    $ref: '#/components/schemas/type_commons_EntityNotFoundErrorMessage'
                required:
                - errorName
                - content
components:
  schemas:
    type_commons_RequestValidationError:
      type: object
      properties:
        fieldName:
          type: string
        humanReadableMessage:
          type: string
      required:
      - fieldName
      title: RequestValidationError
    type_health-care-code-information_v1_ICDCode:
      type: string
      title: ICDCode
    type_health-care-code-information_v1_AdmittingDiagnosisCodeQualifier:
      type: string
      enum:
      - BJ
      - ABJ
      title: AdmittingDiagnosisCodeQualifier
    type_health-care-code-information_v1_DiagnosisRelatedGroupCodeQualifier:
      type: string
      enum:
      - DR
      title: DiagnosisRelatedGroupCodeQualifier
    type_health-care-code-information_v1_OccurrenceInformationCodeQualifier:
      type: string
      enum:
      - BH
      title: OccurrenceInformationCodeQualifier
    type_health-care-code-information_v1_OccurrenceSpanInformation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: 'The id of this health care code information if it is already stored.

            If this is not set, this is referring to a new health care code information to be added

            to the encounter.  If it is set, this refers to an update of an existing health care code

            information object on the encounter.'
        encounter_id:
          $ref: '#/components/schemas/type_commons_EncounterId'
          description: 'The encounter_id of this health care code information if it is already stored.

            This will be set by the server in responses, but clients are not expected to set it.'
        occurrence_span_code_qualifier:
          $ref: '#/components/schemas/type_health-care-code-information_v1_OccurrenceSpanCodeQualifier'
        occurrence_span_code:
          $ref: '#/components/schemas/type_health-care-code-information_v1_OccurrenceSpanCode'
        occurrence_span_date:
          $ref: '#/components/schemas/type_health-care-code-information_v1_RD8Date'
      required:
      - occurrence_span_code_qualifier
      - occurrence_span_code
      - occurrence_span_date
      description: This corresponds to the BI code qualifier value.
      title: OccurrenceSpanInformation
    type_health-care-code-information_v1_TreatmentCodeInformation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: 'The id of this health care code information if it is already stored.

