        other_diagnosis:
          $ref: '#/components/schemas/type_health-care-code-information_v1_ICDCode'
        present_on_admission_indicator:
          $ref: '#/components/schemas/type_health-care-code-information_v1_PresentOnAdmissionIndicatorCode'
      required:
      - other_diagnosis_code_qualifier
      - other_diagnosis
      description: This corresponds to BF and ABF code qualifier values.
      title: OtherDiagnosisInformation
    type_health-care-code-information_v1_MSDRGCode:
      type: string
      title: MSDRGCode
    type_health-care-code-information_v1_ConditionInformation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: 'The id of this health care code information if it is already stored.

            If this is not set, this is referring to a new health care code information to be added

