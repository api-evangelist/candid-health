        treatment_code:
          $ref: '#/components/schemas/type_health-care-code-information_v1_TreatmentCode'
      required:
      - treatment_code_qualifier
      - treatment_code
      description: This corresponds to the TC code qualifier value.
      title: TreatmentCodeInformation
    type_health-care-code-information_v1_OtherDiagnosisInformation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: 'The id of this health care code information if it is already stored.

            If this is not set, this is referring to a new health care code information to be added

            to the encounter.  If it is set, this refers to an update of an existing health care code

            information object on the encounter.'
        encounter_id:
