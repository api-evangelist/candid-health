          description: 'An [RFC 3339, section 5.6 datetime](https://ijmacd.github.io/rfc3339-iso8601/).

            For example, 2017-07-21T17:32:28Z.

            In practice, only the date portion of this is used for claim submission, so

            midnight time is fine.'
      required:
      - principal_procedure_code_qualifier
      - principal_procedure_code
      - procedure_date
      description: This correspond to BBR, BR, and CAH code qualifier values.
      title: PrincipalProcedureInformation
