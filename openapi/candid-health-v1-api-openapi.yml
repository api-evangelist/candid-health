components:
  schemas:
    type_pre-encounter_tags_v1_MutableTag:
      type: object
      properties:
        value:
          type: string
        description:
          type: string
        alert:
          type: boolean
      required:
      - value
      description: An object representing a Tag.
      title: MutableTag
    type_pre-encounter_eligibilityChecks_v1_CobSubscriber:
      type: object
      properties:
        first_name:
          type: string
          description: The subscriber's first name.
        last_name:
          type: string
          description: The subscriber's last name.
        date_of_birth:
          type: string
          description: The subscriber's date of birth.
        member_id:
          type: string
          description: The member ID for the subscriber's insurance policy.
        ssn:
          type: string
          description: The subscriber's Social Security Number (SSN).
      required:
      - first_name
      - last_name
      - date_of_birth
      description: 'The primary policyholder for the insurance plan or a dependent with a unique member ID.

        You must provide at least one of member_id or ssn.'
      title: CobSubscriber
    type_financials_AllocationTarget:
      oneOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - service_line
            description: 'Discriminator value: service_line'
          service_line_id:
            $ref: '#/components/schemas/type_commons_ServiceLineId'
          claim_id:
            $ref: '#/components/schemas/type_commons_ClaimId'
          encounter_id:
            $ref: '#/components/schemas/type_commons_EncounterId'
        required:
        - type
        - service_line_id
        - claim_id
        - encounter_id
      - type: object
        properties:
          type:
            type: string
            enum:
            - claim
            description: 'Discriminator value: claim'
          claim_id:
            $ref: '#/components/schemas/type_commons_ClaimId'
          encounter_id:
            $ref: '#/components/schemas/type_commons_EncounterId'
        required:
        - type
        - claim_id
        - encounter_id
      - type: object
        properties:
          type:
            type: string
            enum:
            - billing_provider_id
            description: 'Discriminator value: billing_provider_id'
          billing_provider_id:
            $ref: '#/components/schemas/type_commons_ProviderId'
        required:
        - type
        - billing_provider_id
      - type: object
        properties:
          type:
            type: string
            enum:
            - appointment
            description: 'Discriminator value: appointment'
          appointment_id:
            $ref: '#/components/schemas/type_commons_AppointmentId'
          patient_external_id:
            $ref: '#/components/schemas/type_commons_PatientExternalId'
        required:
        - type
        - appointment_id
        - patient_external_id
      - type: object
        properties:
          type:
            type: string
            enum:
            - unattributed
            description: 'Discriminator value: unattributed'
        required:
        - type
      discriminator:
        propertyName: type
      description: 'Allocation targets describe whether the portion of a payment is being applied toward a specific service line,

        claim, billing provider, or is unallocated.'
      title: AllocationTarget
    type_guarantor_v1_EncounterHasExistingGuarantorErrorType:
      type: object
      properties:
        message:
          type: string
      required:
      - message
      title: EncounterHasExistingGuarantorErrorType
    type_financials_InvoiceUpdate:
      oneOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - set
            description: 'Discriminator value: set'
          value:
            $ref: '#/components/schemas/type_commons_InvoiceId'
        required:
        - type
        - value
      - type: object
        properties:
          type:
            type: string
            enum:
            - remove
