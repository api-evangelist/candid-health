openapi: 3.2.0
info:
  title: Reference Appointments API
  version: 1.0.0
servers:
- url: https://pre-api.joincandidhealth.com
  description: Production
- url: https://pre-api-staging.joincandidhealth.com
  description: Staging
- url: https://sandbox-pre-api.joincandidhealth.com
  description: CandidSandbox
- url: https://staging-pre-api.joincandidhealth.com
  description: CandidStaging
- url: http://localhost:4000
  description: Local
- url: https://api.joincandidhealth.com
  description: Production
- url: https://api-staging.joincandidhealth.com
  description: Staging
- url: https://sandbox-api.joincandidhealth.com
  description: CandidSandbox
- url: https://staging-api.joincandidhealth.com
  description: CandidStaging
- url: http://localhost:5050
  description: Local
tags:
- name: Appointments
paths:
  /appointments/v1:
    post:
      operationId: create
      summary: Create
      description: Adds an appointment. VersionConflictError is returned when the placer_appointment_id is already in use.
      tags:
      - Appointments
      parameters:
      - name: Authorization
        in: header
        description: OAuth authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_pre-encounter_appointments_v1_Appointment'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - NotFoundError
                  content:
                    $ref: '#/components/schemas/type_pre-encounter_common_ErrorBase4xx'
                required:
                - errorName
                - content
        '409':
          description: Error response with status 409
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - VersionConflictError
                  content:
                    $ref: '#/components/schemas/type_pre-encounter_common_VersionConflictErrorBody'
                required:
                - errorName
                - content
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/type_pre-encounter_appointments_v1_MutableAppointment'
  /appointments/v1/visits:
    get:
      operationId: get_visits
      summary: Get Visits
      description: 'Gets all Visits within a given time range. The return list is ordered by start_time ascending.


        **IMPORTANT:** This endpoint requires a date filter on `appointment.startTimestamp` to ensure acceptable query performance.

        Without date filtering, the query can take 50+ seconds on large datasets due to grouping and aggregation operations.


        Example filters:

        - `appointment.startTimestamp|gt|2024-01-01` - appointments after January 1, 2024

        - `appointment.startTimestamp|eq|2024-12-08` - appointments on December 8, 2024

        - `appointment.startTimestamp|lt|2024-12-31` - appointments before December 31, 2024


        You can combine the date filter with other filters using commas:

        - `appointment.startTimestamp|gt|2024-01-01,appointment.status|eq|PENDING`'
      tags:
      - Appointments
      parameters:
      - name: page_token
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/type_pre-encounter_common_PageToken'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      - name: sort_field
        in: query
        description: Defaults to appointment.start_time.
        required: false
        schema:
          $ref: '#/components/schemas/type_pre-encounter_lists_v1_SortFieldString'
      - name: sort_direction
        in: query
        description: Defaults to ascending.
        required: false
        schema:
          $ref: '#/components/schemas/type_pre-encounter_common_SortDirection'
      - name: filters
        in: query
        description: '**Required:** Must include a date filter on appointment.startTimestamp (using gt, lt, or eq operators).

          Example: appointment.startTimestamp|gt|2024-01-01'
        required: false
        schema:
          $ref: '#/components/schemas/type_pre-encounter_common_FilterQueryString'
      - name: Authorization
        in: header
        description: OAuth authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_pre-encounter_appointments_v1_VisitsPage'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - BadRequestError
                  content:
                    $ref: '#/components/schemas/type_pre-encounter_common_ErrorBase4xx'
                required:
                - errorName
                - content
  /appointments/v1/visits/counts:
    get:
      operationId: get_counts
      summary: Get Counts
      description: 'Gets aggregate counts for the visits matching the given filters.


        The counts respect all provided filters but are independent of pagination, so this can be fetched

        once when filters change instead of on every page of `get_visits`.


        **IMPORTANT:** Like `get_visits`, this endpoint requires a date filter on `appointment.startTimestamp`

        to ensure acceptable query performance.'
      tags:
      - Appointments
      parameters:
      - name: filters
        in: query
        description: '**Required:** Must include a date filter on appointment.startTimestamp (using gt, lt, or eq operators).

          Example: appointment.startTimestamp|gt|2024-01-01'
        required: false
        schema:
          $ref: '#/components/schemas/type_pre-encounter_common_FilterQueryString'
      - name: Authorization
        in: header
        description: OAuth authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_pre-encounter_appointments_v1_CountsResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - BadRequestError
                  content:
                    $ref: '#/components/schemas/type_pre-encounter_common_ErrorBase4xx'
                required:
                - errorName
                - content
  /appointments/v1/{id}:
    get:
      operationId: get
      summary: Get
      description: Gets an appointment.
      tags:
      - Appointments
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/type_pre-encounter_common_AppointmentId'
      - name: Authorization
        in: header
        description: OAuth authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_pre-encounter_appointments_v1_Appointment'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - NotFoundError
                  content:
                    $ref: '#/components/schemas/type_pre-encounter_common_ErrorBase4xx'
                required:
                - errorName
                - content
  /appointments/v1/{id}/history:
    get:
      operationId: get_history
      summary: Get History
      description: Gets an appointment along with it's full history. The return list is ordered by version ascending.
      tags:
      - Appointments
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/type_pre-encounter_common_AppointmentId'
      - name: Authorization
        in: header
        description: OAuth authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/type_pre-encounter_appointments_v1_Appointment'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - NotFoundError
                  content:
                    $ref: '#/components/schemas/type_pre-encounter_common_ErrorBase4xx'
                required:
                - errorName
                - content
  /appointments/v1/{id}/{version}:
    put:
      operationId: update
      summary: Update
      description: Updates an appointment. The path must contain the next version number to prevent race conditions. For example, if the current version of the appointment is n, you will need to send a request to this endpoint with `/{id}/n+1` to update the appointment. Updating historic versions is not supported.
      tags:
      - Appointments
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/type_pre-encounter_common_AppointmentId'
      - name: version
        in: path
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: OAuth authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_pre-encounter_appointments_v1_Appointment'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - NotFoundError
                  content:
                    $ref: '#/components/schemas/type_pre-encounter_common_ErrorBase4xx'
                required:
                - errorName
                - content
        '409':
          description: Error response with status 409
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - VersionConflictError
                  content:
                    $ref: '#/components/schemas/type_pre-encounter_common_VersionConflictErrorBody'
                required:
                - errorName
                - content
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/type_pre-encounter_appointments_v1_MutableAppointment'
    delete:
      operationId: deactivate
      summary: Deactivate
      description: Sets an appointment as deactivated. The path must contain the most recent version to prevent race conditions. Deactivating historic versions is not supported. Subsequent updates via PUT to the appointment will "reactivate" the appointment and set the deactivated flag to false.
      tags:
      - Appointments
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/type_pre-encounter_common_AppointmentId'
      - name: version
        in: path
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: OAuth authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - NotFoundError
                  content:
                    $ref: '#/components/schemas/type_pre-encounter_common_ErrorBase4xx'
                required:
                - errorName
                - content
        '409':
          description: Error response with status 409
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - VersionConflictError
                  content:
                    $ref: '#/components/schemas/type_pre-encounter_common_VersionConflictErrorBody'
                required:
                - errorName
                - content
  /appointments/v1/updates/scan:
    get:
      operationId: scan
      summary: Scan
      description: Scans up to 100 appointment updates. The since query parameter is inclusive, and the result list is ordered by updatedAt ascending.
      tags:
      - Appointments
      parameters:
      - name: since
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: Authorization
        in: header
        description: OAuth authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/type_pre-encounter_appointments_v1_Appointment'
components:
  schemas:
    type_pre-encounter_common_PatientId:
      type: string
      description: The unique identifier for a Patient
      title: PatientId
    type_pre-encounter_common_CanonicalNonInsurancePayerId:
      type: string
      description: The unique identifier for a non-insurance payer configured in the Candid system
      title: CanonicalNonInsurancePayerId
    type_pre-encounter_patients_v1_Referral:
      type: object
      properties:
        provider:
          $ref: '#/components/schemas/type_pre-encounter_common_ExternalProvider'
        referral_number:
          type: string
        period:
          $ref: '#/components/schemas/type_pre-encounter_common_Period'
        notes:
          type: string
        serviceFacility:
          $ref: '#/components/schemas/type_pre-encounter_common_PatientServiceFacility'
        units:
          $ref: '#/components/schemas/type_pre-encounter_patients_v1_ReferralUnit'
        quantity:
          type: integer
        cptCodes:
          type: array
          items:
            type: string
        applyForAllCptCodes:
          type: boolean
      required:
      - provider
      - referral_number
      title: Referral
    type_pre-encounter_appointments_v1_AppointmentStatus:
      type: string
      enum:
      - PENDING
      - NOT_READY
      - READY
      - CHECKED_IN
      title: AppointmentStatus
    type_pre-encounter_appointments_v1_Appointment:
      type: object
      properties:
        organization_id:
          $ref: '#/components/schemas/type_pre-encounter_common_OrganizationId'
          description: The organization that owns this object.
        deactivated:
          type: boolean
          description: True if the object is deactivated.  Deactivated objects are not returned in search results but are returned in all other endpoints including scan.
        version:
          type: integer
          description: The version of the object. Any update to any property of an object object will create a new version.
        updated_at:
          type: string
          format: date-time
        updating_user_id:
          $ref: '#/components/schemas/type_pre-encounter_common_UserId'
          description: The user ID of the user who last updated the object.
        patient_id:
          $ref: '#/components/schemas/type_pre-encounter_common_PatientId'
          description: The Candid-defined patient identifier.
        start_timestamp:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/type_pre-encounter_appointments_v1_AppointmentStatus'
          description: Defaults to PENDING. If status is NOT_READY, work_queue must be set. If status is READY or CHECKED_IN, work_queue must be null. If status is CHECKED_IN, checked_in_timestamp must be set. If checked_in_timestamp is set, status must be CHECKED_IN.
        not_ready_reason:
          $ref: '#/components/schemas/type_pre-encounter_appointments_v1_NotReadyReason'
          description: The reason the appointment is NOT_READY. Must only be set when status is NOT_READY; it is cleared otherwise. It is not recommended to change this value manually via API.
        ready_source:
          $ref: '#/components/schemas/type_pre-encounter_appointments_v1_ReadySource'
          description: The method that set the appointment status to READY. It is not recommended to change this value manually via API. Must only be set when the status is READY or CHECKED_IN, it is cleared otherwise.
        service_duration:
          type: integer
          description: The requested length of time allotted for the appointment. The units are in minutes.
        services:
          type: array
          items:
            $ref: '#/components/schemas/type_pre-encounter_appointments_v1_Service'
        placer_appointment_id:
          type: string
          description: ID for the appointment/order for the event.
        attending_doctor:
          $ref: '#/components/schemas/type_pre-encounter_common_ExternalProvider'
          description: Attending physician information. The attending physician will be stored as the Current MD for the patient.
        estimated_copay_cents:
          type: integer
        estimated_patient_responsibility_cents:
          type: integer
          description: The estimated amount the patient will be responsible for paying at the time of service. This does not include the copay.
        patient_deposit_cents:
          type: integer
        appointment_details:
          type: string
        checked_in_timestamp:
          type: string
          format: date-time
          description: The timestamp when the patient checked in for their appointment. If status is CHECKED_IN, checked_in_timestamp must be set. If checked_in_timestamp is set, status must be CHECKED_IN.
        notes:
          type: string
        location_resource_id:
          type: string
          description: 'Contains the coded identification of the location being scheduled. Components: <Identifier (ST)>^<Text (ST)>'
        automated_eligibility_check_complete:
          type: boolean
          description: True if the automated eligibility check has been completed. It is not recommended to change this value manually via API. This refers explicitly to the automated eligibility check that occurs a specific number of days before the appointment.
        work_queue:
          $ref: '#/components/schemas/type_pre-encounter_appointments_v1_AppointmentWorkQueue'
          description: The work queue that the appointment belongs to. It is not recommended to change this value manually via API. If status is NOT_READY, work_queue must be set. If status is READY, work_queue must be null.
        id:
          $ref: '#/components/schemas/type_pre-encounter_common_AppointmentId'
      required:
      - organization_id
      - deactivated
      - version
      - updated_at
      - updating_user_id
      - patient_id
      - start_timestamp
      - service_duration
      - services
      - id
      description: An appointment object with immutable server-owned properties.
      title: Appointment
    type_pre-encounter_patients_v1_AuthorizationUnit:
      type: string
      enum:
      - VISIT
      - UNIT
      title: AuthorizationUnit
    type_pre-encounter_patients_v1_Contact:
      type: object
      properties:
        relationship:
          type: array
          items:
            $ref: '#/components/schemas/type_pre-encounter_common_Relationship'
        name:
          $ref: '#/components/schemas/type_pre-encounter_common_HumanName'
        telecoms:
          type: array
          items:
            $ref: '#/components/schemas/type_pre-encounter_common_ContactPoint'
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/type_pre-encounter_common_Address'
        period:
          $ref: '#/components/schemas/type_pre-encounter_common_Period'
        hipaa_authorization:
          type: boolean
      required:
      - relationship
      - name
      - telecoms
      - addresses
      title: Contact
    type_pre-encounter_common_ExternalIdentifier:
      type: object
      properties:
        value:
          type: string
        system:
          type: string
        period:
          $ref: '#/components/schemas/type_pre-encounter_common_Period'
      required:
      - value
      - system
      description: An external identifier for a patient
      title: ExternalIdentifier
    type_pre-encounter_common_Relationship:
      type: string
      enum:
      - SELF
      - SPOUSE
      - CHILD
      - COMMON_LAW_SPOUSE
      - OTHER
      title: Relationship
    type_pre-encounter_patients_v1_MutablePatientWithMrn:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/type_pre-encounter_common_HumanName'
        other_names:
          type: array
          items:
            $ref: '#/components/schemas/type_pre-encounter_common_HumanName'
          description: Other names for the patient.
        other_identifiers:
          type: array
          items:
            $ref: '#/components/schemas/type_pre-encounter_common_ExternalIdentifier'
          description: Other identifiers for the patient.
        gender:
          $ref: '#/components/schemas/type_pre-encounter_common_Gender'
        birth_date:
          type: string
          format: date
        social_security_number:
          type: string
        biological_sex:
          $ref: '#/components/schemas/type_pre-encounter_common_Sex'
          description: The biological sex of the patient. This corresponds to the HL7 AdministrativeGender https://www.hl7.org/fhir/valueset-administrative-gender.html
        sexual_orientation:
          $ref: '#/components/schemas/type_pre-encounter_common_SexualOrientation'
          description: The sexual orientation of the patient.
        pronouns:
          type: array
          items:
            type: string
          description: The pronouns of the patient.
        race:
          $ref: '#/components/schemas/type_pre-encounter_common_Race'
        ethnicity:
          $ref: '#/components/schemas/type_pre-encounter_common_Ethnicity'
        disability_status:
          $ref: '#/components/schemas/type_pre-encounter_common_DisabilityStatus'
        marital_status:
          $ref: '#/components/schemas/type_pre-encounter_patients_v1_MaritalStatus'
        deceased:
          type: string
          format: date-time
          description: Time of death for the patient.  Leave unset if the patient is not deceased.
        multiple_birth:
          type: integer
          description: The number of siblings the patient was born with.  Leave unset if the patient was not part of a multiple birth.
        primary_address:
          $ref: '#/components/schemas/type_pre-encounter_common_Address'
          description: The primary address for the patient.
        other_addresses:
          type: array
          items:
            $ref: '#/components/schemas/type_pre-encounter_common_Address'
          description: Other addresses for the patient.
        primary_telecom:
          $ref: '#/components/schemas/type_pre-encounter_common_ContactPoint'
          description: The primary phone number for the patient.
        other_telecoms:
          type: array
          items:
            $ref: '#/components/schemas/type_pre-encounter_common_ContactPoint'
          description: Other phone numbers for the patient.
        email:
          type: string
        electronic_communication_opt_in:
          type: boolean
          description: Use electronic_communication_consent for granular channel-level consent. This field is kept in sync automatically but should not be used for new integrations.
        electronic_communication_consent:
          $ref: '#/components/schemas/type_pre-encounter_patients_v1_ElectronicCommunicationConsent'
          description: Granular consent for electronic communication channels.
        photo:
          type: string
        language:
          type: string
        external_provenance:
          $ref: '#/components/schemas/type_pre-encounter_patients_v1_ExternalProvenance'
          description: Information about the upstream system that owns this patient data.  Leave unset if Candid owns patient data.
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/type_pre-encounter_patients_v1_Contact'
          description: Contacts for the patient.
        general_practitioners:
          type: array
          items:
            $ref: '#/components/schemas/type_pre-encounter_common_ExternalProvider'
        filing_order:
          $ref: '#/components/schemas/type_pre-encounter_patients_v1_FilingOrder'
        coverages_for_related_causes:
          $ref: '#/components/schemas/type_pre-encounter_patients_v1_CoveragesForRelatedCauses'
        non_insurance_payers:
          type: array
          items:
            $ref: '#/components/schemas/type_pre-encounter_common_CanonicalNonInsurancePayerId'
        non_insurance_payer_associations:
          type: array
          items:
            $ref: '#/components/schemas/type_pre-encounter_common_CanonicalNonInsurancePayerAssociation'
        guarantor:
          $ref: '#/components/schemas/type_pre-encounter_patients_v1_Guarantor'
        self_pay:
          type: boolean
        authorizations:
          type: array
          items:
            $ref: '#/components/schemas/type_pre-encounter_patients_v1_Authorization'
        referrals:
          type: array
          items:
            $ref: '#/components/schemas/type_pre-encounter_patients_v1_Referral'
        primary_service_facility_id:
          type: string
        service_facilities:
          type: array
          items:
            $ref: '#/components/schemas/type_pre-encounter_common_PatientServiceFacility'
          description: Associated service facilities for this patient.
        do_not_invoice_reason:
          $ref: '#/components/schemas/type_pre-encounter_patients_v1_DoNotInvoiceReason'
          description: If this value is defined, the customer will not be invoiced.
        note_ids:
          type: array
          items:
            $ref: '#/components/schemas/type_pre-encounter_common_NoteId'
        tag_ids:
          type: array
          items:
            $ref: '#/components/schemas/type_pre-encounter_common_TagId'
        origination_detail:
          $ref: '#/components/schemas/type_pre-encounter_patients_v1_OriginationDetail'
          description: Information about the patient source, if applicable.
        inferred_patient_metadata:
          $ref: '#/components/schemas/type_pre-encounter_patients_v1_InferredPatientMetadata'
          description: Metadata for the patient used for patient inference from encounters.
        orcon:
          type: boolean
          description: ORCON (Originator Controlled) - When set to true, the Candid system will hide this patient from downstream integrations. Updates made in the Candid UI will unset this flag. Defaults to false.
        advanced_directives:
          type: array
          items:
            $ref: '#/components/schemas/type_pre-encounter_patients_v1_AdvancedDirective'
        hipaa_code:
          type: string
        mrn:
          type: string
          description: The medical record number for the patient.
      required:
      - name
      - other_names
      - birth_date
      - biological_sex
      - primary_address
      - other_addresses
      - other_telecoms
      - contacts
      - general_practitioners
      - filing_order
      - mrn
      title: MutablePatientWithMrn
    type_pre-encounter_common_OrganizationId:
      type: string
