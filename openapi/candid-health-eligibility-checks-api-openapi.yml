          type: string
          description: The subscriber's last name.
        middle_name:
          type: string
          description: The subscriber's middle name or initial.
        date_of_birth:
          type: string
          description: The subscriber's date of birth, formatted as YYYYMMDD.
        ssn:
          type: string
          description: The subscriber's Social Security Number (SSN). Full SSN is preferred, but even the last 4 digits can help.
