openapi: 3.2.0
info:
  title: Reference Eligibility Checks API
  version: 1.0.0
servers:
- url: https://pre-api.joincandidhealth.com
  description: Production
- url: https://pre-api-staging.joincandidhealth.com
  description: Staging
- url: https://sandbox-pre-api.joincandidhealth.com
  description: CandidSandbox
- url: https://staging-pre-api.joincandidhealth.com
  description: CandidStaging
- url: http://localhost:4000
  description: Local
- url: https://api.joincandidhealth.com
  description: Production
- url: https://api-staging.joincandidhealth.com
  description: Staging
- url: https://sandbox-api.joincandidhealth.com
  description: CandidSandbox
- url: https://staging-api.joincandidhealth.com
  description: CandidStaging
- url: http://localhost:5050
  description: Local
tags:
- name: Eligibility Checks
paths:
  /eligibility-checks/v1:
    post:
      operationId: post
      summary: Post
      description: Sends real-time eligibility checks to payers through Stedi.
      tags:
      - Eligibility Checks
      parameters:
      - name: Authorization
        in: header
        description: OAuth authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_pre-encounter_eligibilityChecks_v1_EligibilityResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/type_pre-encounter_eligibilityChecks_v1_EligibilityRequest'
  /eligibility-checks/v1/batch:
    post:
      operationId: batch
      summary: Batch
      description: Sends a batch of eligibility checks to payers through Stedi.
      tags:
      - Eligibility Checks
      parameters:
      - name: Authorization
        in: header
        description: OAuth authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_pre-encounter_eligibilityChecks_v1_BatchEligibilityResponse'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/type_pre-encounter_eligibilityChecks_v1_EligibilityRequest'
  /eligibility-checks/v1/batch/{batch_id}:
    get:
      operationId: poll-batch
      summary: Poll Batch
      description: Polls the status of a batch eligibility check.
      tags:
      - Eligibility Checks
      parameters:
      - name: batch_id
        in: path
        required: true
        schema:
          type: string
      - name: page_token
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/type_pre-encounter_common_PageToken'
      - name: Authorization
        in: header
        description: OAuth authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_pre-encounter_eligibilityChecks_v1_EligibilityCheckPage'
  /eligibility-checks/v1/payer/search:
    get:
      operationId: payer-search
      summary: Payer Search
      description: Searches for payers that match the query parameters.
      tags:
      - Eligibility Checks
      parameters:
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
      - name: page_token
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/type_pre-encounter_common_PageToken'
      - name: query
        in: query
        required: false
        schema:
          type: string
      - name: Authorization
        in: header
        description: OAuth authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_pre-encounter_eligibilityChecks_v1_PayerSearchResponse'
  /eligibility-checks/v1/recommendation:
    get:
      operationId: recommendation
      summary: Recommendation
      description: 'Gets recommendation for eligibility checks based on filters. This endpoint will retrieve all the latest eligibility recommendations for each

        eligibility recommendation type for the given filters. If you want to get a specific recommendation type, you can use the `type` query parameter.'
      tags:
      - Eligibility Checks
      parameters:
      - name: filters
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/type_pre-encounter_common_FilterQueryString'
      - name: Authorization
        in: header
        description: OAuth authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/type_pre-encounter_eligibilityChecks_v1_EligibilityRecommendation'
    post:
      operationId: create-recommendation
      summary: Create Recommendation
      description: Create an eligibiilty recommendation based on the request.
      tags:
      - Eligibility Checks
      parameters:
      - name: Authorization
        in: header
        description: OAuth authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_pre-encounter_eligibilityChecks_v1_EligibilityRecommendation'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/type_pre-encounter_eligibilityChecks_v1_PostEligibilityRecommendationRequest'
  /eligibility-checks/v1/recommendation/{recommendation_id}/{version}/vote:
    put:
      operationId: vote-recommendation
      summary: Vote Recommendation
      description: Submit user feedback on an eligibility recommendation. The path must contain the next version number to prevent race conditions. For example, if the current version of the recommendation is n, you will need to send a request to this endpoint with `/{recommendation_id}/{n+1}/vote` to update the vote.
      tags:
      - Eligibility Checks
      parameters:
      - name: recommendation_id
        in: path
        required: true
        schema:
          type: string
      - name: version
        in: path
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: OAuth authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_pre-encounter_eligibilityChecks_v1_EligibilityRecommendation'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - NotFoundError
                  content:
                    $ref: '#/components/schemas/type_pre-encounter_common_ErrorBase4xx'
                required:
                - errorName
                - content
        '409':
          description: Error response with status 409
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - VersionConflictError
                  content:
                    $ref: '#/components/schemas/type_pre-encounter_common_VersionConflictErrorBody'
                required:
                - errorName
                - content
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/type_pre-encounter_eligibilityChecks_v1_Vote'
  /eligibility-checks/v1/get-multi/:
    get:
      operationId: get-multi
      summary: Get Multi
      tags:
      - Eligibility Checks
      parameters:
      - name: page_token
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/type_pre-encounter_common_PageToken'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      - name: subscriber_member_id
        in: query
        required: false
        schema:
          type: string
      - name: payer_id
        in: query
        required: false
        schema:
          type: string
      - name: provider_npi
        in: query
        required: false
        schema:
          type: string
      - name: date_of_service
        in: query
        required: false
        schema:
          type: string
      - name: initiated_at_min
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: initiated_at_max
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: Authorization
        in: header
        description: OAuth authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_pre-encounter_eligibilityChecks_v1_EligibilityCheckPage'
  /eligibility-checks/v1/insurance-discovery:
    post:
      operationId: insurance-discovery
      summary: Insurance Discovery
      description: 'Sends an insurance discovery check to find potential coverage matches for a patient through Stedi.

        Given patient demographics, this endpoint discovers what insurance coverages exist for the patient.'
      tags:
      - Eligibility Checks
      parameters:
      - name: Authorization
        in: header
        description: OAuth authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_pre-encounter_eligibilityChecks_v1_InsuranceDiscoveryResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/type_pre-encounter_eligibilityChecks_v1_InsuranceDiscoveryRequest'
  /eligibility-checks/v1/coordination-of-benefits:
    post:
      operationId: coordination-of-benefits
      summary: Coordination Of Benefits
      description: 'Sends a coordination of benefits check through Stedi to determine whether a patient has

        coverage overlap across multiple payers and, if so, which payer is primary.

        Medicare and Medicare Advantage plans are not supported.'
      tags:
      - Eligibility Checks
      parameters:
      - name: Authorization
        in: header
        description: OAuth authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_pre-encounter_eligibilityChecks_v1_CoordinationOfBenefitsResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/type_pre-encounter_eligibilityChecks_v1_CoordinationOfBenefitsRequest'
components:
  schemas:
    type_pre-encounter_coverages_v1_BenefitType:
      type: string
      enum:
      - DEDUCTIBLE
      - DEDUCTIBLE_CONTRACT
      - DEDUCTIBLE_REMAINING
      - DEDUCTIBLE_YEAR_TO_DATE
      - OOP_MAX
      - OOP_MAX_CONTRACT
      - OOP_MAX_REMAINING
      - OOP_MAX_YEAR_TO_DATE
      - COPAY
      - COINSURANCE
      - NON_COVERED
      - LIMITATION
      title: BenefitType
    type_pre-encounter_eligibilityChecks_v1_Encounter:
      type: object
      properties:
        date_of_service:
          type: string
          format: date
          description: Defaults to the current date if not provided.
        service_type_codes:
          type: array
          items:
            type: string
          description: 'Defaults to HealthBenefitPlanCoverage (30) if not provided.

            <Note>Not all payers support multiple service type codes, so it is recommended to only include a single code per request.</Note>'
      title: Encounter
    type_pre-encounter_eligibilityChecks_v1_Cob:
      type: object
      properties:
        classification:
          type: string
          description: 'The classification for the discovered benefits. One of: `CobInstanceExistsPrimacyDetermined`,

            `CobInstanceExistsPrimacyUndetermined`, `CoverageOverlapNoBenefitOverlap`,

            `CoverageOverlapExistsNotSubjectToCob`, or `MemberFoundNoCob`.'
        instance_exists:
          type: boolean
          description: If true, the COB response contains at least one coordination of benefits instance.
        primacy_determined:
          type: boolean
          description: If true, Stedi was able to determine the primary payer for the patient.
        coverage_overlap:
          type: boolean
          description: If true, the patient has active coverage with two or more payers during the service date.
        benefit_overlap:
          type: boolean
          description: If true, the patient has active coverage from two or more payers for the same service type code.
      description: 'An overview of the COB response. Indicates whether there is a coverage overlap, whether that

        overlap creates a coordination of benefits instance, and whether Stedi was able to identify

        payer primacy (when a COB instance exists).'
      title: Cob
    type_pre-encounter_eligibilityChecks_v1_CobProvider:
      type: object
      properties:
        organization_name:
          type: string
          description: The provider's business name. Required if the provider is an organization.
        first_name:
          type: string
          description: The provider's first name. Required if the provider is an individual.
        last_name:
          type: string
          description: The provider's last name. Required if the provider is an individual.
        npi:
          type: string
          description: The provider's National Provider Identifier (NPI).
      required:
      - npi
      description: 'Information about the entity requesting the COB check.

        Provide either organization_name (for organizations) or first_name and last_name (for individuals), plus npi.'
      title: CobProvider
    type_pre-encounter_common_ErrorBase4xx:
      type: object
      properties:
        message:
          type: string
        data:
          description: Any type
      required:
      - message
      title: ErrorBase4xx
    type_pre-encounter_eligibilityChecks_v1_CoordinationOfBenefitsRequest:
      type: object
      properties:
        trading_partner_service_id:
          type: string
          description: 'The Payer ID. Each check must be for a participating health plan for which the patient has coverage.

            Medicare and Medicare Advantage plans are not supported.'
        provider:
          $ref: '#/components/schemas/type_pre-encounter_eligibilityChecks_v1_CobProvider'
        subscriber:
          $ref: '#/components/schemas/type_pre-encounter_eligibilityChecks_v1_CobSubscriber'
        dependent:
          $ref: '#/components/schemas/type_pre-encounter_eligibilityChecks_v1_CobDependent'
        encounter:
          $ref: '#/components/schemas/type_pre-encounter_eligibilityChecks_v1_CobEncounter'
      required:
      - trading_partner_service_id
      - provider
      - subscriber
      - encounter
      description: An object representing the data for a coordination of benefits request.
      title: CoordinationOfBenefitsRequest
    type_pre-encounter_eligibilityChecks_v1_EligibilityCheckErrorDetails:
      type: object
      properties:
        field?:
          type: string
        description?:
          type: string
        location?:
          type: string
        possibleResolutions?:
          type: string
        code?:
          type: string
        followupAction?:
          type: string
      description: This object is our fern representation of Stedi's EligbilityCheckError object from their API.
      title: EligibilityCheckErrorDetails
    type_pre-encounter_eligibilityChecks_v1_InsuranceDiscoveryDependent:
      type: object
      properties:
        first_name:
          type: string
          description: The dependent's first name.
        last_name:
          type: string
          description: The dependent's last name.
        middle_name:
          type: string
          description: The dependent's middle name or initial.
        date_of_birth:
          type: string
          description: The dependent's date of birth, formatted as YYYYMMDD.
        ssn:
          type: string
          description: The dependent's Social Security Number (SSN).
        gender:
          $ref: '#/components/schemas/type_pre-encounter_eligibilityChecks_v1_InsuranceDiscoveryGender'
        address:
          $ref: '#/components/schemas/type_pre-encounter_eligibilityChecks_v1_InsuranceDiscoveryAddress'
      required:
      - first_name
      - last_name
      description: 'Demographic information for the patient when they are a dependent on a health plan.

        If you only have the dependent''s information, identify them in the subscriber object instead and leave this empty.'
      title: InsuranceDiscoveryDependent
    type_pre-encounter_eligibilityChecks_v1_Provider:
      oneOf:
      - $ref: '#/components/schemas/type_pre-encounter_eligibilityChecks_v1_IndividualProvider'
      - $ref: '#/components/schemas/type_pre-encounter_eligibilityChecks_v1_OrganizationProvider'
      title: Provider
    type_pre-encounter_coverages_v1_BenefitsRelatedEntity:
      type: object
      properties:
        entityIdentifier:
          type: string
        entityType:
          type: string
        entityName:
          type: string
        contactInformation:
          type: array
          items:
            $ref: '#/components/schemas/type_pre-encounter_coverages_v1_RelatedEntityContact'
        serviceTypeCodes:
          type: array
          items:
            $ref: '#/components/schemas/type_pre-encounter_coverages_v1_ServiceTypeCode'
      title: BenefitsRelatedEntity
    type_pre-encounter_coverages_v1_CoverageLevel:
      type: string
      enum:
      - EMPLOYEE_AND_CHILDREN
      - EMPLOYEE_ONLY
      - EMPLOYEE_AND_SPOUSE
      - FAMILY
      - INDIVIDUAL
      title: CoverageLevel
    type_pre-encounter_eligibilityChecks_v1_EligibilityCheckError:
      type: object
      properties:
        source:
          $ref: '#/components/schemas/type_pre-encounter_eligibilityChecks_v1_EligibilityCheckErrorSource'
        errorDetails:
          $ref: '#/components/schemas/type_pre-encounter_eligibilityChecks_v1_EligibilityCheckErrorDetails'
      required:
      - source
      - errorDetails
      title: EligibilityCheckError
    type_pre-encounter_coverages_v1_PlanCoverage:
      type: object
      properties:
        in_network:
          $ref: '#/components/schemas/type_pre-encounter_coverages_v1_PlanCoverageDetails'
        in_network_flat:
          type: array
          items:
            $ref: '#/components/schemas/type_pre-encounter_coverages_v1_CoverageDetails'
        out_of_network:
          $ref: '#/components/schemas/type_pre-encounter_coverages_v1_PlanCoverageDetails'
        out_of_network_flat:
          type: array
          items:
            $ref: '#/components/schemas/type_pre-encounter_coverages_v1_CoverageDetails'
      title: PlanCoverage
    type_pre-encounter_coverages_v1_CoverageDetails:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/type_pre-encounter_coverages_v1_BenefitType'
        coverageLevel:
          $ref: '#/components/schemas/type_pre-encounter_coverages_v1_CoverageLevel'
        unit:
          $ref: '#/components/schemas/type_pre-encounter_coverages_v1_CoverageValueUnit'
        value:
          type: number
          format: double
        additional_notes:
          type: string
      required:
      - type
      - coverageLevel
      - unit
      - value
      title: CoverageDetails
    type_pre-encounter_coverages_v1_CoverageValue:
      type: object
      properties:
        family:
          type: number
          format: double
        individual:
          type: number
          format: double
        employeeAndSpouse:
          type: number
          format: double
        employeeAndChildren:
          type: number
          format: double
      title: CoverageValue
    type_pre-encounter_eligibilityChecks_v1_EligibilityRequest:
      type: object
      properties:
        submitter_transaction_identifier:
          type: string
          description: 'A unique identifier for the eligibility check within the batch. Candid returns this identifier in the response for the

            /batch/{batch_id} polling endpoint so you can correlate benefit responses with the original eligibility check.'
        payer_id:
          type: string
          description: Supported payer ID values can be found [here](https://www.stedi.com/healthcare/network).
        provider:
          $ref: '#/components/schemas/type_pre-encounter_eligibilityChecks_v1_Provider'
        subscriber:
          $ref: '#/components/schemas/type_pre-encounter_coverages_v1_MemberInfo'
          description: The primary policyholder for the insurance plan or a dependent with a unique member ID. <Note>If a dependent has a unique member ID, include their information here and leave dependent undefined.</Note>
        dependent:
          $ref: '#/components/schemas/type_pre-encounter_coverages_v1_MemberInfo'
          description: <Note>If a dependent has a unique member ID, include their information as subscriber and leave this field undefined.</Note>
        encounter:
          $ref: '#/components/schemas/type_pre-encounter_eligibilityChecks_v1_Encounter'
        get_existing_check_initiated_after:
          type: string
          format: date-time
          description: If not provided, this endpoint will run a fresh eligibility check. If provided, it will return an existing successful eligibility check if one exists that was initiated after provided date with the same parameters (Date of Service, Payer ID, Provider, Subscriber, Dependent, and Encounter).
        source:
          type: string
        portal_password:
          type: string
          description: The password that the provider uses to log in to the payer's portal. This is not commonly used.
        portal_username:
          type: string
          description: The username that the provider uses to log in to the payer's portal. This is not commonly used.
      required:
      - payer_id
      - provider
      - subscriber
      description: An object representing the data for an eligibility request.
      title: EligibilityRequest
    type_pre-encounter_common_FilterQueryString:
      type: string
      description: 'A serialized list of filters separated by commas indicating filters to apply.  Each filter is of the form ''path:operator:value''. Example: ''patient.mrn|eq|12345''.  Filters are separated by commas. Example: ''patient.mrn|eq|12345,appointment.startDate|gt|67890''. All filters are ANDed together.  Valid operators are ''eq'', ''gt'', ''lt'', ''contains'', ''ieq'', ''in''. ieq is a case-insensitive equality operator. in allows searching for values that match any item in a semicolon-separated list (e.g., ''patient.id|in|foo;bar;baz''). Path values are camelCase.'
      title: FilterQueryString
    type_pre-encounter_coverages_v1_ExpandedMemberInfo:
      type: object
      properties:
        member_id:
          type: string
        group_number:
          type: string
        first_name:
          type: string
        middle_name:
          type: string
        last_name:
          type: string
        date_of_birth:
          type: string
        gender:
          type: string
        address:
          $ref: '#/components/schemas/type_pre-encounter_coverages_v1_Address'
      title: ExpandedMemberInfo
    type_pre-encounter_eligibilityChecks_v1_StediPayer:
      type: object
      properties:
        stedi_id:
          type: string
        display_name:
          type: string
        primary_payer_id:
          type: string
        aliases:
          type: array
          items:
            type: string
        names:
          type: array
          items:
            type: string
        transaction_support:
          description: Any type
        employer_identification_numbers:
          type: array
          items:
            type: string
        payer_enrollment:
          description: Any type
        parent_payer_group:
          type: string
        coverage_types:
          type: array
          items:
            type: string
      required:
      - stedi_id
      - display_name
      - primary_payer_id
      - aliases
      - names
      - transaction_support
      title: StediPayer
    type_pre-encounter_eligibilityChecks_v1_EligibilityRecommendation:
      type: object
      properties:
        organization_id:
          $ref: '#/components/schemas/type_pre-encounter_common_OrganizationId'
          description: The organization that owns this object.
        deactivated:
          type: boolean
          description: True if the object is deactivated.  Deactivated objects are not returned in search results but are returned in all other endpoints including scan.
        version:
          type: integer
          description: The version of the object. Any update to any property of an object object will create a new version.
        updated_at:
          type: string
          format: date-time
        updating_user_id:
          $ref: '#/components/schemas/type_pre-encounter_common_UserId'
          description: The user ID of the user who last updated the object.
        id:
          type: string
          description: The unique UUID identifier for an EligibilityRecommendation.
        eligibility_check_id:
          type: string
        recommendation:
          $ref: '#/components/schemas/type_pre-encounter_eligibilityChecks_v1_EligibilityRecommendationPayload'
        coverage_id:
          $ref: '#/components/schemas/type_pre-encounter_common_CoverageId'
        patient:
          $ref: '#/components/schemas/type_pre-encounter_eligibilityChecks_v1_EligibilityRecommendationPatientInfo'
        votes:
          type: array
          items:
            $ref: '#/components/schemas/type_pre-encounter_eligibilityChecks_v1_Vote'
          description: Array of votes for this recommendation
      required:
      - organization_id
      - deactivated
      - version
      - updated_at
      - updating_user_id
      - id
      - eligibility_check_id
      - recommendation
      - patient
      description: An eligibility recommendation object that contains an EligibilityRecommendationType and a payload of data denoting the recommendation.
      title: EligibilityRecommendation
    type_pre-encounter_eligibilityChecks_v1_CobSubscriber:
      type: object
      properties:
        first_name:
          type: string
          description: The subscriber's first name.
        last_name:
          type: string
          description: The subscriber's last name.
        date_of_birth:
          type: string
          description: The subscriber's date of birth.
        member_id:
          type: string
          description: The member ID for the subscriber's insurance policy.
        ssn:
          type: string
          description: The subscriber's Social Security Number (SSN).
