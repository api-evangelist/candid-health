openapi: 3.2.0
info:
  title: Reference Organization Providers API
  version: 1.0.0
servers:
- url: https://pre-api.joincandidhealth.com
  description: Production
- url: https://pre-api-staging.joincandidhealth.com
  description: Staging
- url: https://sandbox-pre-api.joincandidhealth.com
  description: CandidSandbox
- url: https://staging-pre-api.joincandidhealth.com
  description: CandidStaging
- url: http://localhost:4000
  description: Local
- url: https://api.joincandidhealth.com
  description: Production
- url: https://api-staging.joincandidhealth.com
  description: Staging
- url: https://sandbox-api.joincandidhealth.com
  description: CandidSandbox
- url: https://staging-api.joincandidhealth.com
  description: CandidStaging
- url: http://localhost:5050
  description: Local
tags:
- name: Organization Providers
paths:
  /api/organization-providers/v3/{organization_provider_id}:
    get:
      operationId: get
      summary: Get organization provider
      tags:
      - Organization Providers
      parameters:
      - name: organization_provider_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/type_organization-providers_v2_OrganizationProviderId'
      - name: Authorization
        in: header
        description: OAuth authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_organization-providers_v3_OrganizationProviderV2'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - EntityNotFoundError
                  content:
                    $ref: '#/components/schemas/type_commons_EntityNotFoundErrorMessage'
                required:
                - errorName
                - content
    patch:
      operationId: update
      summary: Update organization provider
      tags:
      - Organization Providers
      parameters:
      - name: organization_provider_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/type_organization-providers_v2_OrganizationProviderId'
      - name: Authorization
        in: header
        description: OAuth authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_organization-providers_v3_OrganizationProviderV2'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - EntityNotFoundError
                  content:
                    $ref: '#/components/schemas/type_commons_EntityNotFoundErrorMessage'
                required:
                - errorName
                - content
        '422':
          description: Error response with status 422
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - UpdatesDisabledDueToExternalSystemIntegrationError
                  content:
                    $ref: '#/components/schemas/type_commons_UpdatesDisabledDueToExternalSystemIntegrationErrorMessage'
                required:
                - errorName
                - content
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/type_organization-providers_v3_OrganizationProviderUpdateV2'
  /api/organization-providers/v3:
    get:
      operationId: get_multi
      summary: Get all organization providers
      tags:
      - Organization Providers
      parameters:
      - name: limit
        in: query
        description: Limit the number of results returned. Defaults to 100.
        required: false
        schema:
          type: integer
      - name: search_term
        in: query
        description: Filter to a name or a part of a name.
        required: false
        schema:
          type: string
      - name: npi
        in: query
        description: Filter to a specific NPI.
        required: false
        schema:
          type: string
      - name: is_rendering
        in: query
        description: Filter to only rendering providers.
        required: false
        schema:
          type: boolean
      - name: is_billing
        in: query
        description: Filter to only billing providers.
        required: false
        schema:
          type: boolean
      - name: organization_provider_ids
        in: query
        description: Filter to the provided organization provider IDs.
        required: false
        schema:
          $ref: '#/components/schemas/type_organization-providers_v2_OrganizationProviderId'
      - name: page_token
        in: query
        description: The page token to continue paging through a previous request.
        required: false
        schema:
          $ref: '#/components/schemas/type_commons_PageToken'
      - name: sort
        in: query
        description: Defaults to PROVIDER_NAME_ASC.
        required: false
        schema:
          $ref: '#/components/schemas/type_organization-providers_v2_OrganizationProviderSortOptions'
      - name: organization_id
        in: query
        description: Filter to a specific organization's providers. If not provided, defaults to the requesting user's organization.
        required: false
        schema:
          $ref: '#/components/schemas/type_commons_OrganizationId'
      - name: Authorization
        in: header
        description: OAuth authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_organization-providers_v3_OrganizationProviderPageV2'
    post:
      operationId: create
      summary: Create organization provider
      tags:
      - Organization Providers
      parameters:
      - name: Authorization
        in: header
        description: OAuth authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_organization-providers_v3_OrganizationProviderV2'
        '422':
          description: Error response with status 422
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - UpdatesDisabledDueToExternalSystemIntegrationError
                  content:
                    $ref: '#/components/schemas/type_commons_UpdatesDisabledDueToExternalSystemIntegrationErrorMessage'
                required:
                - errorName
                - content
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/type_organization-providers_v3_OrganizationProviderCreateV2'
  /api/organization-providers/v3/{organization_provider_id}/attachments:
    put:
      operationId: upload_attachment
      summary: Upload provider attachment
      description: 'Uploads a file to the provider. Accepted file types are W9, PECOS_RECORD, and BANK_LETTER_OR_VOIDED_CHECK.

        Only one file per type is allowed per provider — uploading when a file of the same type already exists returns a 409.'
      tags:
      - Organization Providers
      parameters:
      - name: organization_provider_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/type_organization-providers_v2_OrganizationProviderId'
      - name: Authorization
        in: header
        description: OAuth authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_organization-providers_v3_ProviderAttachmentId'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                attachment_file:
                  type: string
                  format: binary
                  description: The file to upload.
                file_type:
                  $ref: '#/components/schemas/type_organization-providers_v3_ProviderAttachmentFileType'
              required:
              - attachment_file
              - file_type
    get:
      operationId: list_attachments
      summary: List provider attachments
      tags:
      - Organization Providers
      parameters:
      - name: organization_provider_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/type_organization-providers_v2_OrganizationProviderId'
      - name: Authorization
        in: header
        description: OAuth authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/type_organization-providers_v3_ProviderAttachment'
  /api/organization-providers/v3/attachments/download:
    get:
      operationId: download_attachment
      summary: Download provider attachment
      tags:
      - Organization Providers
      parameters:
      - name: attachment_id
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/type_organization-providers_v3_ProviderAttachmentId'
      - name: Authorization
        in: header
        description: OAuth authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_organization-providers_v3_ProviderAttachmentResponse'
  /api/organization-providers/v3/attachments/{attachment_id}:
    delete:
      operationId: delete_attachment
      summary: Delete provider attachment
      tags:
      - Organization Providers
      parameters:
      - name: attachment_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/type_organization-providers_v3_ProviderAttachmentId'
      - name: Authorization
        in: header
        description: OAuth authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
