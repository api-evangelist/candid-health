          description: 'Date formatted as YYYY-MM-DD; eg: 2019-08-25.

            This date must be the local date in the timezone where the service occurred.

            If omitted, the Encounter is assumed to be for a single day.

            Must not be temporally before the date_of_service field.

            If there are greater than zero service lines, it is recommended to specify end_date_of_service on the service_line instead of on the encounter to prepare for future API versions.'
        patient_authorized_release:
          type: boolean
          description: 'Whether this patient has authorized the release of medical information

            for billing purpose.

            Box 12 on the CMS-1500 claim form  or Form Locator 52 on a UB-04 claim form.'
        benefits_assigned_to_provider:
          type: boolean
          description: 'Whether this patient has authorized insurance payments to be made to you,

            not them. If false, patient may receive reimbursement.

            Box 13 on the CMS-1500 claim form or Form Locator 53 on a UB-04 claim form.'
        provider_accepts_assignment:
          type: boolean
          description: 'Whether you have accepted the patient''s authorization for insurance payments

            to be made to you, not them.

            Box 27 on the CMS-1500 claim form. There is no exact equivalent of this field on a UB-04 claim, however contributes to the concept of Form Locator 53.'
        appointment_type:
          type: string
          description: 'Human-readable description of the appointment type (ex: "Acupuncture - Headaches").'
        existing_medications:
          type: array
          items:
            $ref: '#/components/schemas/type_encounters_v4_Medication'
        interventions:
          type: array
          items:
            $ref: '#/components/schemas/type_encounters_v4_Intervention'
        pay_to_address:
          $ref: '#/components/schemas/type_commons_StreetAddressLongZip'
          description: Specifies the address to which payments for the claim should be sent.
        synchronicity:
          $ref: '#/components/schemas/type_encounters_v4_SynchronicityType'
          description: 'Whether or not this was a synchronous or asynchronous encounter.

            Asynchronous encounters occur when providers and patients communicate online using

            forms, instant messaging, or other pre-recorded digital mediums.

            Synchronous encounters occur in live, real-time settings where the patient interacts

            directly with the provider, such as over video or a phone call.'
        vitals:
          $ref: '#/components/schemas/type_encounters_v4_Vitals'
        billable_status:
          $ref: '#/components/schemas/type_encounters_v4_BillableStatusType'
          description: 'Defines if the Encounter is to be billed by Candid to the responsible_party.

            Examples for when this should be set to NOT_BILLABLE include

            if the Encounter has not occurred yet or if there is no intention of ever billing the responsible_party.'
        additional_information:
          type: string
          description: 'Defines additional information on the claim needed by the payer.

            Box 19 on the CMS-1500 claim form or Form Locator 80 on a UB-04 claim form.'
        service_authorization_exception_code:
          $ref: '#/components/schemas/type_encounters_v4_ServiceAuthorizationExceptionCode'
          description: '837p Loop2300 REF*4N

            Required when mandated by government law or regulation to obtain authorization for specific service(s) but, for the

            reasons listed in one of the enum values of ServiceAuthorizationExceptionCode, the service was performed without

            obtaining the authorization.'
        admission_date:
          type: string
          format: date
          description: '837p Loop2300 DTP*435, CMS-1500 Box 18 or UB-04 Form Locator 12.

            Required on all ambulance claims when the patient was known to be admitted to the hospital.

            OR

            Required on all claims involving inpatient medical visits.'
        discharge_date:
          type: string
          format: date
          description: 837p Loop2300 DTP*096, CMS-1500 Box 18 Required for inpatient claims when the patient was discharged from the facility and the discharge date is known. Not used on an institutional claim.
        onset_of_current_illness_or_symptom_date:
          type: string
          format: date
          description: "837p Loop2300 DTP*431, CMS-1500 Box 14\nRequired for the initial medical service or visit performed in response to a medical emergency when the date is available and is different than the date of service.\nOR\nThis date is the onset of acute symptoms for the current illness or condition.\n For UB-04 claims, this is populated separately via occurrence codes."
        last_menstrual_period_date:
          type: string
          format: date
          description: '837p Loop2300 DTP*484, CMS-1500 Box 14

            Required when, in the judgment of the provider, the services on this claim are related to the patient''s pregnancy.

            This field is populated separately via occurrence codes for UB-04 claim forms.'
        delay_reason_code:
          $ref: '#/components/schemas/type_commons_DelayReasonCode'
          description: 'Code indicating the reason why a claim submission was delayed.

            Corresponds to CLM-20 in the 837 specification (both professional and institutional).'
        patient:
          $ref: '#/components/schemas/type_individual_PatientCreate'
          description: Contains the identification information of the individual receiving medical services.
        referring_provider:
          $ref: '#/components/schemas/type_encounter-providers_v2_ReferringProvider'
          description: 'The final provider who referred the services that were rendered.

            All physicians who order services or refer Medicare beneficiaries must

            report this data.'
        initial_referring_provider:
          $ref: '#/components/schemas/type_encounter-providers_v2_InitialReferringProvider'
          description: 'The second iteration of Loop ID-2310 on an 837P form. Use code "P3 - Primary Care Provider" in this loop to

            indicate the initial referral from the primary care provider or whatever provider wrote the initial referral for this patient''s episode of care being billed/reported in this transaction.

            Not used in an 837i claim'
        supervising_provider:
          $ref: '#/components/schemas/type_encounter-providers_v2_SupervisingProvider'
          description: Required when the rendering provider is supervised by a physician. If not required by this implementation guide, do not send.
        treating_provider:
          $ref: '#/components/schemas/type_encounter-providers_v2_TreatingProvider'
          description: The treating provider is the provider who treats the patient. This is only supported for professional encounters.
        service_facility:
          $ref: '#/components/schemas/type_service-facility_EncounterServiceFacilityBase'
          description: Encounter Service facility is typically the location a medical service was rendered, such as a provider office or hospital. For telehealth, service facility can represent the provider's location when the service was delivered (e.g., home), or the location where an in-person visit would have taken place, whichever is easier to identify. If the provider is in-network, service facility may be defined in payer contracts. Box 32 on the CMS-1500 claim form. There is no equivalent on the paper UB-04 claim form, but this field is equivalent to Loop 2310E Service Facility Location details on an 837i form, and is used when this is different to the entity identified as the Billing Provider. Note that for an in-network claim to be successfully adjudicated, the service facility address listed. This field is mutually exclusive with service_facility_id — providing both will result in a 422 error.
        service_facility_id:
          $ref: '#/components/schemas/type_organization-service-facilities_v2_OrganizationServiceFacilityId'
          description: The ID of an existing Organization Service Facility to use for this encounter. The service facility's canonical data (name, address, NPI, etc.) will be populated automatically. If the value does not match an existing Organization Service Facility, the request will fail with a 422 error. This field is mutually exclusive with service_facility — providing both will result in a 422 error.
        subscriber_primary:
          $ref: '#/components/schemas/type_individual_SubscriberCreate'
          description: 'Subscriber_primary is required when responsible_party is INSURANCE_PAY (i.e. when the claim should be billed to insurance).

            These are not required fields when responsible_party is SELF_PAY (i.e. when the claim should be billed to the patient).

            However, if you collect this for patients, even self-pay, we recommend including it when sending encounters to Candid.

            Note: Cash Pay is no longer a valid payer_id in v4, please use responsible party to define self-pay claims.'
        subscriber_secondary:
          $ref: '#/components/schemas/type_individual_SubscriberCreate'
          description: Please always include this when you have it, even for self-pay claims.
        subscriber_tertiary:
          $ref: '#/components/schemas/type_individual_SubscriberCreate'
          description: Please always include this when you have it, even for self-pay claims.
        prior_authorization_number:
          $ref: '#/components/schemas/type_encounters_v4_PriorAuthorizationNumber'
          description: Box 23 on the CMS-1500 claim form or Form Locator 63 on a UB-04 claim form.
        responsible_party:
          $ref: '#/components/schemas/type_encounters_v4_ResponsiblePartyType'
          description: Defines the party to be billed with the initial balance owed on the claim.
        clinical_notes:
          type: array
          items:
            $ref: '#/components/schemas/type_encounters_v4_ClinicalNoteCategoryCreate'
          description: Holds a collection of clinical observations made by healthcare providers during patient encounters. Please note that medical records for appeals should be sent using the Encounter Attachments API.
        billing_notes:
          type: array
          items:
            $ref: '#/components/schemas/type_billing-notes_v2_BillingNoteBase'
          description: 'Spot to store misc, human-readable, notes about this encounter to be used

            in the billing process.'
        patient_histories:
          type: array
          items:
            $ref: '#/components/schemas/type_encounters_v4_PatientHistoryCategory'
        guarantor:
          $ref: '#/components/schemas/type_guarantor_v1_GuarantorCreate'
          description: Personal and contact info for the guarantor of the patient responsibility.
        external_claim_submission:
          $ref: '#/components/schemas/type_claim-submission_v1_ExternalClaimSubmissionCreate'
          description: 'To be included for claims that have been submitted outside of Candid.

            Candid supports posting remits and payments to these claims and working them in-platform (e.g. editing, resubmitting).'
        tag_ids:
          type: array
          items:
            $ref: '#/components/schemas/type_tags_TagId'
          description: Names of tags that should be on the encounter.
        schema_instances:
          type: array
          items:
            $ref: '#/components/schemas/type_custom-schemas_v1_SchemaInstance'
          description: 'Key-value pairs that must adhere to a schema created via the Custom Schema API. Multiple schema

            instances cannot be created for the same schema on an encounter.'
        referral_number:
          type: string
          description: Refers to REF*9F on the 837p and 837i. Value cannot be greater than 50 characters.
        epsdt_referral:
          $ref: '#/components/schemas/type_encounters_v4_EPSDTReferral'
          description: Refers to Box 24H on the CMS1500 form and Loop 2300 CRC - EPSDT Referral on the 837P and 837i form
        claim_supplemental_information:
          type: array
          items:
            $ref: '#/components/schemas/type_encounters_v4_ClaimSupplementalInformation'
          description: Refers to Loop 2300 - Segment PWK on the 837P and 837i forms. No more than 10 entries are permitted.
        secondary_payer_carrier_code:
          type: string
          description: When Medicaid is billed as the secondary payer the Carrier Code is used to identify the primary payer. This is required for certain states.
        related_causes_information:
          $ref: '#/components/schemas/type_related-causes_v1_RelatedCausesInformationCreate'
          description: Corresponds to box 10a on the CMS-1500 (Loop 2300 on 837)
        property_casualty_claim_number:
          type: string
          description: 837p Loop2010 REF02, CMS1500 Box 11b
        accident_date:
          type: string
          format: date
          description: 837p Loop2300 DTP*439, CMS1500 Box 15
        property_casualty_patient_identifier:
          $ref: '#/components/schemas/type_property-and-casualty_v1_PropertyCasualtyPatientIdentifierCreate'
          description: 'Patient identifier for Property and Casualty claims

            837p Loop 2010CA'
        billing_provider:
          $ref: '#/components/schemas/type_encounter-providers_v2_BillingProvider'
          description: The billing provider is the provider or business entity submitting the claim. Billing provider may be, but is not necessarily, the same person/NPI as the rendering provider. From a payer's perspective, this represents the person or entity being reimbursed. When a contract exists with the target payer, the billing provider should be the entity contracted with the payer. In some circumstances, this will be an individual provider. In that case, submit that provider's NPI and the tax ID (TIN) that the provider gave to the payer during contracting. In other cases, the billing entity will be a medical group. If so, submit the group NPI and the group's tax ID. Box 33 on the CMS-1500 claim or Form Locator 1 on a UB-04 claim form.
        place_of_service_code:
          $ref: '#/components/schemas/type_commons_FacilityTypeCode'
          description: Box 24B on the CMS-1500 claim form. 837p Loop2300, CLM-05-1. This box is not used on a UB-04 or 837i claim form. 02 for telemedicine, 11 for in-person. Full list [here](https://www.cms.gov/Medicare/Coding/place-of-service-codes/Place_of_Service_Code_Set).
        rendering_provider:
          $ref: '#/components/schemas/type_encounter-providers_v2_RenderingProvider'
          description: 'The rendering provider is the practitioner -- physician, nurse practitioner, etc. -- performing the service.

            For telehealth services, the rendering provider performs the visit, asynchronous communication, or other service. The rendering provider address should generally be the same as the service facility address.'
        service_lines:
          type: array
          items:
            $ref: '#/components/schemas/type_service-lines_v2_UniversalServiceLineCreate'
        health_care_code_information:
          $ref: '#/components/schemas/type_health-care-code-information_v1_HealthCareCodeInformationCreate'
          description: The health care code information associated with this encounter, which includes things such as diagnoses, vitals, procedures, occurrences, reason for visit, and numerous other code related fields.
        submission_expectation:
          $ref: '#/components/schemas/type_encounters_v4_EncounterSubmissionExpectation'
          description: Describes the currently expected target form for this encounter.  This can change later, but it orients this encounter in the pipeline and affects reporting.
        attending_provider:
          $ref: '#/components/schemas/type_encounter-providers_v2_RenderingProvider'
          description: 837i NM1 2500 variant for Loop ID-2310.  Used to indicate the individual whom has overall responsibility for the patient in institutional claims processing.
        admission_hour:
          type: integer
          description: '837i Loop 2300 DTP-03

            Extension of the admission date with hour (0-23 integer) details.'
        admission_type_code:
          $ref: '#/components/schemas/type_x12_v1_TypeOfAdmissionOrVisitCode'
          description: 837i Loop 2300 CL1-01 Code used to indicate the priority of an admission or visit. Equivalent to Form Locator 14 Priority of Admission on a UB-04 claim, not used on CMS-1500 claim forms.
        admission_source_code:
          $ref: '#/components/schemas/type_x12_v1_PointOfOriginForAdmissionOrVisitCode'
          description: 837i Loop 2300 CLI1-02 Code used to indicate the conditions under which an admission occurs. Equivalent to Form Locator 15 Point of Origin on a UB-04 claim, not used on CMS-1500 claim forms.
        discharge_hour:
          type: integer
          description: '837i Loop 2300 DTP-03

            Extension of the discharge date with hour (0-23 integer) details.'
        discharge_status:
          $ref: '#/components/schemas/type_x12_v1_PatientDischargeStatusCode'
          description: '837i CL1-03 or Form Locator 17 on a UB-04 claim form. This is a required field on UB-04 claims.

            Code indicating patient status as of the "statement covers through date" .'
        operating_provider:
          $ref: '#/components/schemas/type_encounter-providers_v2_RenderingProvider'
          description: 837i NM1 2500 variant for Loop ID-2310.  Used to indicate the individual whom has primary responsibility for surgical procedures in institutional claims processing.
        other_operating_provider:
          $ref: '#/components/schemas/type_encounter-providers_v2_RenderingProvider'
          description: 837i NM1 2500 variant for Loop ID-2310.  Used to indicate the individual whom has secondary responsibility for surgical procedures in institutional claims processing.  Only used when operating_provider is also set.
        type_of_bill:
          $ref: '#/components/schemas/type_x12_v1_TypeOfBillCompositeUpdate'
          description: Four digit code used in institutional forms to indicate the type of bill (e.g., hospital inpatient, hospital outpatient). First digit is a leading 0, followed by the type_of_facility, type_of_care, then frequency_code. Professional forms are not required to submit this attribute. You may send the 4 digit code via raw_code, or each individual digit separately via composite_codes.
        accident_state_or_province_code:
          $ref: '#/components/schemas/type_commons_State'
          description: 837i-REF1000 -- an optional state indicating where an accident related to the encounter occurred.
      required:
      - external_id
      - patient_authorized_release
      - benefits_assigned_to_provider
      - provider_accepts_assignment
      - billable_status
      - patient
      - responsible_party
      - billing_provider
      - submission_expectation
      title: UniversalEncounterCreate
    type_health-care-code-information_v1_HealthCareCodeInformationUpdate:
      type: object
      properties:
        principal_diagnosis:
          $ref: '#/components/schemas/type_health-care-code-information_v1_SetOrClearPrincipalDiagnosis'
          description: Set & Replace semantics.  If the id matches the existing principal_diagnosis, that diagnosis is updated in place.  If the entry has no id, it is created newly, its id will be in the response, and any existing principal_diagnosis is deleted and removed from any service line pointers.
        other_diagnosis_information:
          type: array
          items:
            $ref: '#/components/schemas/type_health-care-code-information_v1_OtherDiagnosisInformation'
          description: Set & Replace semantics.  For each entry that has an id, any previous other_diagnosis_information by that id is updated in place.  For each entry without an id, it is created newly and its id will be in the response.  For each existing entry that was not referred to by id, it is deleted, including having it removed from any service line pointers.
        admitting_diagnosis:
          $ref: '#/components/schemas/type_health-care-code-information_v1_SetOrClearAdmittingDiagnosis'
          description: Set & Replace semantics.  If the id matches the existing admitting_diagnosis, that diagnosis is updated in place.  If the entry has no id, it is created newly, its id will be in the response, and any existing principal_diagnosis is deleted. This object only applies to 837i institutional claim forms.
        patient_reasons_for_visit:
          type: array
          items:
            $ref: '#/components/schemas/type_health-care-code-information_v1_PatientReasonForVisit'
          description: Set & Replace semantics.  For each entry that has an id, any previous patient_reasons_for_visit by that id is updated in place.  For each entry without an id, it is created newly and its id will be in the response.  For each existing entry that was not referred to by id, it is deleted. This object only applies to 837i institutional claim forms.
        external_causes_of_injury:
          type: array
          items:
            $ref: '#/components/schemas/type_health-care-code-information_v1_ExternalCauseOfInjury'
          description: Set & Replace semantics.  For each entry that has an id, any previous external_causes_of_injury by that id is updated in place.  For each entry without an id, it is created newly and its id will be in the response.  For each existing entry that was not referred to by id, it is deleted. This object only applies to 837i institutional claim forms.
        diagnosis_related_groups:
          $ref: '#/components/schemas/type_health-care-code-information_v1_SetOrClearDiagnosisRelatedGroup'
          description: Set & Replace semantics.  If the id matches the existing diagnosis_related_groups, that diagnosis_related_group is updated in place.  If the entry has no id, it is created newly, its id will be in the response, and any existing diagnosis_related_groups is deleted. This object only applies to 837i institutional claim forms.
        principal_procedure:
          $ref: '#/components/schemas/type_health-care-code-information_v1_SetOrClearPrincipalProcedureInformation'
          description: Set & Replace semantics.  If the id matches the existing principal_procedure, that principal_procedure is updated in place.  If the entry has no id, it is created newly, its id will be in the response, and any existing principal_procedure is deleted. This object only applies to 837i institutional claim forms.
        other_procedure_information:
          type: array
          items:
            $ref: '#/components/schemas/type_health-care-code-information_v1_OtherProcedureInformation'
          description: Set & Replace semantics.  For each entry that has an id, any previous other_procedure_information by that id is updated in place.  For each entry without an id, it is created newly and its id will be in the response.  For each existing entry that was not referred to by id, it is deleted. This object only applies to 837i institutional claim forms.
        occurrence_span_information:
          type: array
          items:
            $ref: '#/components/schemas/type_health-care-code-information_v1_OccurrenceSpanInformation'
          description: Set & Replace semantics.  For each entry that has an id, any previous occurrence_span_information by that id is updated in place.  For each entry without an id, it is created newly and its id will be in the response.  For each existing entry that was not referred to by id, it is deleted. This object only applies to 837i institutional claim forms.
        occurrence_information:
          type: array
          items:
            $ref: '#/components/schemas/type_health-care-code-information_v1_OccurrenceInformation'
          description: Set & Replace semantics.  For each entry that has an id, any previous occurrence_information by that id is updated in place.  For each entry without an id, it is created newly and its id will be in the response.  For each existing entry that was not referred to by id, it is deleted. This object only applies to 837i institutional claim forms.
        treatment_code_information:
          type: array
          items:
            $ref: '#/components/schemas/type_health-care-code-information_v1_TreatmentCodeInformation'
          description: Set & Replace semantics.  For each entry that has an id, any previous treatment_code_information by that id is updated in place.  For each entry without an id, it is created newly and its id will be in the response.  For each existing entry that was not referred to by id, it is deleted. This object only applies to 837i institutional claim forms.
        value_information:
          type: array
          items:
            $ref: '#/components/schemas/type_health-care-code-information_v1_ValueInformation'
          description: Set & Replace semantics.  For each entry that has an id, any previous value_information by that id is updated in place.  For each entry without an id, it is created newly and its id will be in the response.  For each existing entry that was not referred to by id, it is deleted. This object only applies to 837i institutional claim forms.
        condition_information:
          type: array
          items:
            $ref: '#/components/schemas/type_health-care-code-information_v1_ConditionInformation'
          description: Set & Replace semantics.  For each entry that has an id, any previous condition_information by that id is updated in place.  For each entry without an id, it is created newly and its id will be in the response.  For each existing entry that was not referred to by id, it is deleted. This object only applies to 837i institutional claim forms.
      title: HealthCareCodeInformationUpdate
