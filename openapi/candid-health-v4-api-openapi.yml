    type_health-care-code-information_v1_PrincipalProcedureInformation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: 'The id of this health care code information if it is already stored.

            If this is not set, this is referring to a new health care code information to be added

            to the encounter.  If it is set, this refers to an update of an existing health care code

            information object on the encounter.'
        encounter_id:
          $ref: '#/components/schemas/type_commons_EncounterId'
          description: 'The encounter_id of this health care code information if it is already stored.

            This will be set by the server in responses, but clients are not expected to set it.'
        principal_procedure_code_qualifier:
          $ref: '#/components/schemas/type_health-care-code-information_v1_PrincipalProcedureInformationCodeQualifier'
        principal_procedure_code:
          $ref: '#/components/schemas/type_health-care-code-information_v1_ICDCode'
        procedure_date:
          $ref: '#/components/schemas/type_health-care-code-information_v1_D8Date'
          description: 'An [RFC 3339, section 5.6 datetime](https://ijmacd.github.io/rfc3339-iso8601/).

            For example, 2017-07-21T17:32:28Z.

            In practice, only the date portion of this is used for claim submission, so

            midnight time is fine.'
      required:
      - principal_procedure_code_qualifier
      - principal_procedure_code
      - procedure_date
      description: This correspond to BBR, BR, and CAH code qualifier values.
      title: PrincipalProcedureInformation
