      - rendering_provider
      - service_facility
      - responsible_party
      - url
      - diagnoses
      - clinical_notes
      - patient_histories
      - patient_payments
      - tags
      - owner_of_next_action
      - submission_origin
      - schema_instances
      - created_at
      title: Encounter
