    type_fee-schedules_v3_MatchNetworkTypes:
      type: object
      properties:
        value:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/type_commons_NetworkType'
        match:
          type: boolean
        explanation:
          type: string
      required:
      - value
      - match
      - explanation
      description: Match information for network types
      title: MatchNetworkTypes
    type_fee-schedules_v3_MatchFacilityTypeCode:
      type: object
      properties:
        value:
          $ref: '#/components/schemas/type_commons_FacilityTypeCode'
        match:
          type: boolean
        explanation:
          type: string
      required:
      - match
      - explanation
      description: Match information for facility type code
      title: MatchFacilityTypeCode
    type_fee-schedules_v3_MatchPayerPlanGroups:
      type: object
      properties:
        value:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/type_commons_PayerPlanGroupId'
        match:
          type: boolean
        explanation:
          type: string
      required:
      - value
      - match
      - explanation
      description: Match information for a payer plan
      title: MatchPayerPlanGroups
    type_fee-schedules_v3_PayerThresholdsPage:
      type: object
      properties:
        prev_page_token:
          $ref: '#/components/schemas/type_commons_PageToken'
        next_page_token:
          $ref: '#/components/schemas/type_commons_PageToken'
        payer_thresholds:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/type_fee-schedules_v3_PayerThreshold'
      required:
      - payer_thresholds
      title: PayerThresholdsPage
    type_commons_EntityNotFoundErrorMessage:
      type: object
      properties:
        id:
          type: string
      required:
      - id
      title: EntityNotFoundErrorMessage
    type_fee-schedules_v3_ThresholdMatch:
      type: object
      properties:
        threshold:
          $ref: '#/components/schemas/type_fee-schedules_v3_PayerThreshold'
        rate_cents:
          type: integer
        match:
          type: boolean
        explanation:
          type: string
      required:
      - threshold
      - rate_cents
      - match
      - explanation
      description: Threshold and dollar amount matching for a service line
      title: ThresholdMatch
    type_fee-schedules_v3_RateEntry:
      type: object
      properties:
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        rate_cents:
          type: integer
        is_deactivated:
          type: boolean
      required:
      - start_date
