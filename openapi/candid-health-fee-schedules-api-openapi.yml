openapi: 3.2.0
info:
  title: Reference Fee Schedules API
  version: 1.0.0
servers:
- url: https://pre-api.joincandidhealth.com
  description: Production
- url: https://pre-api-staging.joincandidhealth.com
  description: Staging
- url: https://sandbox-pre-api.joincandidhealth.com
  description: CandidSandbox
- url: https://staging-pre-api.joincandidhealth.com
  description: CandidStaging
- url: http://localhost:4000
  description: Local
- url: https://api.joincandidhealth.com
  description: Production
- url: https://api-staging.joincandidhealth.com
  description: Staging
- url: https://sandbox-api.joincandidhealth.com
  description: CandidSandbox
- url: https://staging-api.joincandidhealth.com
  description: CandidStaging
- url: http://localhost:5050
  description: Local
tags:
- name: Fee Schedules
paths:
  /api/fee-schedules/v3/service-line/{service_line_id}/match:
    get:
      operationId: get_match
      summary: Get Match
      description: Gets the rate that matches a service line. No result means no rate exists matching the service line's dimensions.
      tags:
      - Fee Schedules
      parameters:
      - name: service_line_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/type_commons_ServiceLineId'
      - name: Authorization
        in: header
        description: OAuth authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_fee-schedules_v3_MatchResult'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - EntityNotFoundError
                  content:
                    $ref: '#/components/schemas/type_commons_EntityNotFoundErrorMessage'
                required:
                - errorName
                - content
        '422':
          description: Error response with status 422
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - FailedToBuildServiceLineDimensions
                  content:
                    $ref: '#/components/schemas/type_commons_ErrorMessage'
                required:
                - errorName
                - content
  /api/fee-schedules/v3/service-line/{service_line_id}/match/{rate_id}:
    get:
      operationId: test_match
      summary: Test Match
      description: Tests a service line against a rate to see if it matches.
      tags:
      - Fee Schedules
      parameters:
      - name: service_line_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/type_commons_ServiceLineId'
      - name: rate_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/type_commons_RateId'
      - name: Authorization
        in: header
        description: OAuth authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_fee-schedules_v3_MatchTestResult'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - EntityNotFoundError
                  content:
                    $ref: '#/components/schemas/type_commons_EntityNotFoundErrorMessage'
                required:
                - errorName
                - content
        '422':
          description: Error response with status 422
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - FailedToBuildServiceLineDimensions
                  content:
                    $ref: '#/components/schemas/type_commons_ErrorMessage'
                required:
                - errorName
                - content
  /api/fee-schedules/v3:
    get:
      operationId: get_multi
      summary: Get Multi
      description: Gets a list of dimensions with their rates. The rates returned will always be the most recent versions of those rates.
      tags:
      - Fee Schedules
      parameters:
      - name: page_token
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/type_commons_PageToken'
      - name: limit
        in: query
        description: Max number of dimensions returned. Defaults to 100. Max is 100.
        required: false
        schema:
          type: integer
      - name: active_date
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: payer_uuid
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/type_payers_v3_PayerUuid'
      - name: organization_billing_provider_id
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/type_organization-providers_v2_OrganizationProviderId'
      - name: states
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/type_commons_State'
      - name: zip_codes
        in: query
        required: false
        schema:
          type: string
      - name: license_types
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/type_organization-providers_v2_LicenseType'
      - name: facility_type_codes
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/type_commons_FacilityTypeCode'
      - name: network_types
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/type_commons_NetworkType'
      - name: payer_plan_group_ids
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/type_commons_PayerPlanGroupId'
      - name: cpt_code
        in: query
        required: false
        schema:
          type: string
      - name: modifiers
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/type_commons_ProcedureModifier'
      - name: Authorization
        in: header
        description: OAuth authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_fee-schedules_v3_RatesPage'
    post:
      operationId: upload_fee_schedule
      summary: Upload a fee schedule (a collection of rates)
      description: 'Uploads a new fee schedule.


        Each rate may either be totally new as qualified by its dimensions or a new version for an existing rate.


        If adding a new version to an existing rate, the rate must be posted with the next version number (previous version + 1) or a EntityConflictError will

        be returned.


        Use the dry run flag to discover already existing rates and to run validations. If validations for any rate fail, no rates will

        be saved to the system.'
      tags:
      - Fee Schedules
      parameters:
      - name: Authorization
        in: header
        description: OAuth authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/type_fee-schedules_v3_Rate'
        '422':
          description: Error response with status 422
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - FeeScheduleValidationHttpError
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/type_fee-schedules_v3_RateUploadWithPossibleErrors'
                required:
                - errorName
                - content
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dry_run:
                  type: boolean
                rates:
                  type: array
                  items:
                    $ref: '#/components/schemas/type_fee-schedules_v3_RateUpload'
              required:
              - dry_run
              - rates
  /api/fee-schedules/v3/unique-dimension-values:
    get:
      operationId: get_unique_values_for_dimension
      summary: Get Unique Values For Dimension
      description: Gets unique values for a dimension based on other selection criteria. The response is a list of dimensions with your criteria and the unique values populated. This API is useful for driving pivots on dimension values.
      tags:
      - Fee Schedules
      parameters:
      - name: page_token
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/type_commons_PageToken'
      - name: limit
        in: query
        description: Max number of values returned. Defaults to 1000. Max is 1000.
        required: false
        schema:
          type: integer
      - name: pivot_dimension
        in: query
        description: The name of the dimension to fetch unique values for.
        required: true
        schema:
          $ref: '#/components/schemas/type_fee-schedules_v3_DimensionName'
      - name: payer_uuid
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/type_payers_v3_PayerUuid'
      - name: organization_billing_provider_id
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/type_organization-providers_v2_OrganizationProviderId'
      - name: states
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/type_commons_State'
      - name: zip_codes
        in: query
        required: false
        schema:
          type: string
      - name: license_types
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/type_organization-providers_v2_LicenseType'
      - name: facility_type_codes
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/type_commons_FacilityTypeCode'
      - name: network_types
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/type_commons_NetworkType'
      - name: payer_plan_group_ids
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/type_commons_PayerPlanGroupId'
      - name: cpt_code
        in: query
        required: false
        schema:
          type: string
      - name: modifiers
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/type_commons_ProcedureModifier'
      - name: Authorization
        in: header
        description: OAuth authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_fee-schedules_v3_DimensionsPage'
  /api/fee-schedules/v3/{rate_id}/history:
    get:
      operationId: get_rate_history
      summary: Get Rate History
      description: Gets every version of a rate.
      tags:
      - Fee Schedules
      parameters:
      - name: rate_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/type_commons_RateId'
      - name: Authorization
        in: header
        description: OAuth authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/type_fee-schedules_v3_Rate'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - EntityNotFoundError
                  content:
                    $ref: '#/components/schemas/type_commons_EntityNotFoundErrorMessage'
                required:
                - errorName
                - content
  /api/fee-schedules/v3/{rate_id}/{version}:
    delete:
      operationId: delete_rate
      summary: Delete a rate
      description: Soft deletes a rate from the system. Only the most recent version of a rate can be deleted.
      tags:
      - Fee Schedules
      parameters:
      - name: rate_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/type_commons_RateId'
      - name: version
        in: path
        required: true
        schema:
          type: integer
      - name: Authorization
        in: header
        description: OAuth authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - EntityNotFoundError
                  content:
                    $ref: '#/components/schemas/type_commons_EntityNotFoundErrorMessage'
                required:
                - errorName
                - content
        '409':
          description: Error response with status 409
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - EntityConflictError
                  content:
                    $ref: '#/components/schemas/type_commons_EntityConflictErrorMessage'
                required:
                - errorName
                - content
  /api/fee-schedules/v3/payer-threshold/default:
    get:
      operationId: get_payer_thresholds_default
      summary: Get Payer Thresholds Default
      description: Gets the default payer threshold
      tags:
      - Fee Schedules
      parameters:
      - name: Authorization
        in: header
        description: OAuth authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_fee-schedules_v3_PayerThreshold'
  /api/fee-schedules/v3/payer-threshold:
    get:
      operationId: get_payer_thresholds
      summary: Get Payer Thresholds
      description: Gets a list of payers and thresholds by their uuids
      tags:
      - Fee Schedules
      parameters:
      - name: payer_uuids
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/type_payers_v3_PayerUuid'
      - name: Authorization
        in: header
        description: OAuth authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_fee-schedules_v3_PayerThresholdsPage'
  /api/fee-schedules/v3/payer-threshold/{payer_uuid}:
    put:
      operationId: set_payer_threshold
      summary: Set Payer Threshold
      description: Sets the threshold information for a payer
      tags:
      - Fee Schedules
      parameters:
      - name: payer_uuid
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/type_payers_v3_PayerUuid'
      - name: Authorization
        in: header
        description: OAuth authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_fee-schedules_v3_PayerThreshold'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorName:
                    type: string
                    enum:
                    - EntityNotFoundError
                  content:
                    $ref: '#/components/schemas/type_commons_EntityNotFoundErrorMessage'
                required:
                - errorName
                - content
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/type_fee-schedules_v3_PayerThreshold'
  /api/fee-schedules/v3/hard-delete:
    post:
      operationId: hard_delete_rates
      summary: Hard delete rates
      description: Hard deletes rates from the system that match the provided dimensions. This is a destructive operation and cannot be undone. If an empty dimensions object is provided, all rates will be hard deleted. The maximum number of rates this API will delete at a time is 10000. Returns the number of rates deleted and if that number is the maximum, the caller should call this API again to continue deleting rates.
      tags:
      - Fee Schedules
      parameters:
      - name: Authorization
        in: header
        description: OAuth authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/type_fee-schedules_v3_OptionalDimensions'
  /api/fee-schedules/v3/hard-delete-by-ids:
    post:
      operationId: hard_delete_rates_by_ids
      summary: Hard delete rates by IDs
      description: Hard deletes specific rates from the system by their IDs. This is a destructive operation and cannot be undone. Limited to 100 rate IDs maximum per request. For bulk deletion of more than 100 rates, use the hard_delete_rates endpoint with dimension filters. Returns the number of rates deleted.
      tags:
      - Fee Schedules
      parameters:
      - name: Authorization
        in: header
        description: OAuth authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                rate_ids:
                  type: array
                  items:
                    $ref: '#/components/schemas/type_commons_RateId'
              required:
              - rate_ids
components:
  schemas:
    type_commons_PageToken:
      type: string
      title: PageToken
    type_fee-schedules_v3_MatchPayer:
      type: object
      properties:
        value:
          $ref: '#/components/schemas/type_payers_v3_PayerUuid'
        match:
          type: boolean
        explanation:
          type: string
      required:
      - value
      - match
      - explanation
      description: Match information for a payer
      title: MatchPayer
    type_fee-schedules_v3_RateUpload:
      oneOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - new_rate
            description: 'Discriminator value: new_rate'
          dimensions:
            $ref: '#/components/schemas/type_fee-schedules_v3_Dimensions'
          entries:
            type: array
            items:
              $ref: '#/components/schemas/type_fee-schedules_v3_RateEntry'
        required:
        - type
        - dimensions
        - entries
      - type: object
        properties:
          type:
            type: string
            enum:
            - new_version
            description: 'Discriminator value: new_version'
          rate_id:
            $ref: '#/components/schemas/type_commons_RateId'
          previous_version:
            type: integer
            description: New versions of rates must indicate the exact version they modify. When the system attempts to save this new version, if the latest version in the system does not equal this previous_version, the request will be rejected with a EntityConflictError.
          entries:
            type: array
            items:
              $ref: '#/components/schemas/type_fee-schedules_v3_RateEntry'
        required:
        - type
        - rate_id
        - previous_version
        - entries
      discriminator:
        propertyName: type
      title: RateUpload
    type_fee-schedules_v3_MatchDate:
      type: object
      properties:
        value:
          type: string
          format: date
        match:
          type: boolean
        explanation:
          type: string
      required:
      - match
      - explanation
      description: Match information for date of service
      title: MatchDate
    type_fee-schedules_v3_MatchLicenseType:
      type: object
      properties:
        value:
          $ref: '#/components/schemas/type_organization-providers_v2_LicenseType'
        match:
          type: boolean
        explanation:
          type: string
      required:
      - match
      - explanation
      description: Match information for rendering provider license type
      title: MatchLicenseType
    type_fee-schedules_v3_MatchResult:
      type: object
      properties:
        threshold:
          $ref: '#/components/schemas/type_fee-schedules_v3_ThresholdMatch'
        rate_id:
          $ref: '#/components/schemas/type_commons_RateId'
      required:
      - threshold
      - rate_id
      title: MatchResult
    type_organization-providers_v2_LicenseType:
