name: Candid Health Data Model
description: Entity-relationship graph derived from Candid Health's OpenAPI. Candid's 805 component schemas
  are dominated by request/response wrappers, enums and union members; the entities below are the durable,
  id-bearing business objects an integrator actually stores. Relationships were computed from typed id-reference
  fields (<entity>_id) — Candid rarely uses $ref to link entities, it links by id, so an id-field walk
  is the only accurate way to read the graph.
id_convention: Every entity carries either a bare `id` (all pre-encounter services) or a self-named `<entity>_id`
  (all post-encounter/billing services). Ids are UUIDs with no type prefix, so an id is not self-describing
  — the field name is the only type information. Client-supplied `external_id` / `<entity>_external_id`
  fields sit alongside them as the caller's own key into their EMR.
