notes:
- 'Encounter is the hub: it is the anchor for ServiceLine, Diagnosis, BillingNote, SupplementalInformation
  and every health-care-code-information record.'
- The financial entities form a second cluster around Allocation/BalanceEarmark, which move money between
  an Invoice, an Encounter and a ServiceLine.
- Candid also publishes these shapes as a warehouse schema (Candid Data Share, BigQuery) with export_*
  table names that mirror the entities here.
