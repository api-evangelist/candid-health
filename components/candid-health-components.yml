name: Candid Health Vitals — React Component Library
description: >-
  Vitals is Candid Health's first-party, publicly published React design system.
  It ships on npm as @candidhealth/react-vitals and documents itself in a public
  Storybook at vitals.joincandidhealth.com, with 224 catalogued stories across 45
  components. Read it for what it is: a UI KIT, not an embedded API surface. Unlike
  Stripe Elements or Plaid Link there is no hosted, tokenized widget that talks to
  the Candid API on a customer's behalf — no embedded eligibility check, no hosted
  patient-payment collection form. Vitals renders inputs and tables; the caller still
  wires every one of them to the REST API itself.
