notes:
  - >-
    Publishing a design system openly is unusual for a private RCM vendor and is the
    clearest public artifact of Candid's own product surface, but it does not move the
    needle on API ergonomics: an integrator building against Candid gets no client-side
    component that speaks to the API.
  - >-
    The Storybook is served anonymously with no auth wall, so the component inventory
    above is fully verifiable by anyone.
